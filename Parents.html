<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: #f4f7fc; padding: 40px; height: 100vh; overflow-x: hidden; }

    /* --- HEADER --- */
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .page-title { font-size: 22px; color: #0f172a; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .page-title span { color: #64748b; font-weight: 400; font-size: 16px; background: #e2e8f0; padding: 2px 10px; border-radius: 20px; }
    .action-btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .action-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); }

    /* --- TOOLBAR --- */
    .toolbar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 10px 10px 0 0; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; gap: 12px; margin: 0 -40px; padding-left: 60px; padding-right: 60px; }
    .search-box { display: flex; align-items: center; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 8px; width: 300px; background: #f8fafc; }
    .search-box input { border: none; outline: none; background: transparent; width: 100%; margin-left: 8px; font-size: 14px; color: #333; }

    /* --- TABLE --- */
    .table-container { background: white; border-radius: 0 0 10px 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow-x: auto; margin: 0 -40px; padding: 0 40px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
    th { text-align: left; padding: 16px 20px; color: #475569; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; white-space: nowrap; }
    td { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
    tr:hover { background-color: #f8fafc; }

    /* --- BADGES & BOOLEAN --- */
    .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
    .badge-primary { background: #dcfce7; color: #166534; }
    .badge-secondary { background: #f1f5f9; color: #475569; }
    .badge-yes { background: #dbeafe; color: #1d4ed8; }
    .badge-no { background: #fee2e2; color: #991b1b; }

    /* --- ACTIONS --- */
    .actions-cell { display: flex; gap: 10px; justify-content: center; }
    .action-icon-btn { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 6px; color: #64748b; display: inline-flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .action-icon-btn:hover { transform: scale(1.1); }
    .action-icon-btn.edit-btn:hover { background: #eff6ff; color: #2563eb; }
    .action-icon-btn.delete-btn:hover { background: #fef2f2; color: #dc2626; }

    /* --- LOADING --- */
    #loading { text-align: center; padding: 40px; color: #64748b; }

    /* --- MODALS --- */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: white; width: 90%; max-width: 600px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); transform: scale(0.95); transition: transform 0.25s ease; overflow: hidden; display: flex; flex-direction: column; }
    .modal-backdrop.active .modal-content { transform: scale(1); }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 18px; color: #0f172a; font-weight: 600; }
    .modal-close { color: #94a3b8; font-size: 24px; background: none; border: none; cursor: pointer; }
    .modal-close:hover { color: #334155; }
    .modal-body { padding: 24px; max-height: 70vh; overflow-y: auto; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid #f1f5f9; background: #f8fafc; display: flex; justify-content: flex-end; gap: 12px; }
    
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #475569; margin-bottom: 6px; }
    .form-input, .form-select { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; color: #0f172a; background: #fff; transition: border-color 0.15s; }
    .form-input:focus, .form-select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
    
    .readonly-field { background: #f8fafc !important; color: #475569 !important; cursor: not-allowed; }

    .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; color: #1e293b; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }

    @media (max-width: 768px) {
      body { padding: 20px; }
      .table-container { margin: 0 -20px; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .toolbar { flex-direction: column; align-items: flex-start; }
      .search-box { width: 100%; }
      .form-grid-2, .form-grid-3 { grid-template-columns: 1fr; }
    }

    /* --- DARK MODE STYLES --- */
    body.dark-mode { background-color: #0f172a; color: #f1f5f9; }
    body.dark-mode .page-title { color: #f1f5f9; }
    body.dark-mode .page-title span { background: #1e293b; color: #94a3b8; }
    body.dark-mode .toolbar { background: #1e293b; border-bottom-color: #334155; }
    body.dark-mode .search-box { background: #0f172a; border-color: #334155; }
    body.dark-mode .search-box input { color: #f1f5f9; }
    body.dark-mode .form-input, body.dark-mode .form-select { background: #1e293b; border-color: #334155; color: #f1f5f9; }
    body.dark-mode .table-container { background: #1e293b; }
    body.dark-mode thead { background: #0f172a; border-bottom-color: #334155; }
    body.dark-mode th { color: #94a3b8; }
    body.dark-mode td { color: #f1f5f9; border-bottom-color: #334155; }
    body.dark-mode tr:hover { background-color: #334155; }
    body.dark-mode .modal-content { background: #1e293b; }
    body.dark-mode .modal-header { border-bottom-color: #334155; }
    body.dark-mode .modal-header h3 { color: #f1f5f9; }
    body.dark-mode .modal-footer { background: #0f172a; border-top-color: #334155; }
    body.dark-mode .form-label { color: #94a3b8; }
    body.dark-mode .btn-secondary { background: #334155; color: #f1f5f9; }
    body.dark-mode .readonly-field { background: #0f172a !important; color: #94a3b8 !important; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="page-header">
    <div class="page-title">
      👨‍👩‍👧‍👦 Parent/Student Mappings
      <span id="mapCount">0</span>
    </div>
    <button class="action-btn" onclick="openAddModal()">+ Create Mapping</button>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Search by Parent ID, Student, or Name..." onkeyup="filterTable()">
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-container">
    <div id="loading">Loading mappings...</div>
    <table id="mappingTable" style="display:none;">
      <thead>
        <tr>
          <th>Mapping ID</th>
          <th>Parent User ID</th>
          <th>Parent Name</th>
          <th>Student ID</th>
          <th>Student Name</th>
          <th>Relationship</th>
          <th>Is Primary</th>
          <th>Billing</th>
          <th class="text-center" style="text-align: center;">Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- ADD/EDIT MODAL -->
  <div class="modal-backdrop" id="mapModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Create Parent Mapping</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="mapForm" onsubmit="handleSubmit(event)">
        <input type="hidden" id="formMappingId">
        <div class="modal-body">
          
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="parentUserId">Parent User ID</label>
              <select id="parentUserId" class="form-select" required>
                <option value="" disabled selected>Select Parent User</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="parentNameDisplay">Parent Name</label>
              <input type="text" id="parentNameDisplay" class="form-input" placeholder="Enter parent name" required>
            </div>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="studentId">Student ID</label>
              <select id="studentId" class="form-select" required onchange="autoFillStudentName()">
                <option value="" disabled selected>Select Student</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="studentName">Student Name (Auto-Filled)</label>
              <input type="text" id="studentName" class="form-input readonly-field" readonly placeholder="Select a Student ID above">
            </div>
          </div>

          <div class="form-grid-3">
            <div class="form-group">
              <label class="form-label" for="relationship">Relationship</label>
              <select id="relationship" class="form-select" required>
                <option value="" disabled selected>Select Relationship</option>
                <option value="Mother">Mother</option>
                <option value="Father">Father</option>
                <option value="Guardian">Guardian</option>
                <option value="Sponsor">Sponsor</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="isPrimary">Is Primary Contact?</label>
              <select id="isPrimary" class="form-select">
                <option value="FALSE">No</option>
                <option value="TRUE">Yes</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="billing">Billing</label>
              <select id="billing" class="form-select">
                <option value="" disabled selected>Select Billing</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>
          </div>

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Mapping</button>
        </div>
      </form>
    </div>
  </div>

  <!-- DELETE CONFIRM MODAL -->
  <div class="modal-backdrop" id="deleteModal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h3>Delete Mapping</h3>
        <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="color: #64748b; font-size: 15px; line-height: 1.5;">
          Are you sure you want to delete mapping <strong id="deleteMapId" style="color: #0f172a;"></strong>? This action cannot be undone.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <script>
    // Define modal functions in global scope immediately
    window.openAddModal = function() { 
      document.getElementById('mapForm').reset();
      document.getElementById('formMappingId').value = '';
      document.getElementById('modalTitle').innerText = 'Create Parent Mapping';
      document.getElementById('saveBtn').innerText = 'Save Mapping';
      document.getElementById('parentNameDisplay').value = '';
      document.getElementById('studentName').value = '';
      document.getElementById('mapModal').classList.add('active'); 
    };

    window.closeModal = function() { 
      document.getElementById('mapModal').classList.remove('active');
    };

    window.openDeleteModal = function(id, parent, student) {
      currentDeleteId = id;
      document.getElementById('deleteMapping').innerText = `${parent} → ${student}`;
      document.getElementById('deleteModal').classList.add('active');
    };

    window.closeDeleteModal = function() {
      document.getElementById('deleteModal').classList.remove('active');
      currentDeleteId = null;
    };

    let mapList = [];
    let currentDeleteId = null;
    let usersMap = {}; // To store User IDs and Names
    let studentsMap = {}; // To store Student IDs and Names

    document.addEventListener('DOMContentLoaded', function() {
      loadDropdowns();
      refreshData();
    });

    function refreshData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('mappingTable').style.display = 'none';
      google.script.run.withSuccessHandler(renderTable).getParentsData();
    }

    /* --- POPULATE DROPDOWNS & MAPS --- */
    function loadDropdowns() {
      // Load Users
      google.script.run.withSuccessHandler(function(users) {
        const select = document.getElementById('parentUserId');
        select.innerHTML = '<option value="" disabled selected>Select Parent User</option>';
        usersMap = {};
        users.forEach(u => {
          usersMap[u.userId] = u.fullName;
          let opt = document.createElement('option');
          opt.value = u.userId;
          opt.innerText = `${u.userId} - ${u.fullName}`;
          select.appendChild(opt);
        });
      }).getUserPairs();

      // Load Students
      google.script.run.withSuccessHandler(function(students) {
        const select = document.getElementById('studentId');
        select.innerHTML = '<option value="" disabled selected>Select Student</option>';
        studentsMap = {};
        students.forEach(s => {
          studentsMap[s.studentId] = s.fullName;
          let opt = document.createElement('option');
          opt.value = s.studentId;
          opt.innerText = `${s.studentId} - ${s.fullName}`;
          select.appendChild(opt);
        });
      }).getStudentIdNamePairs();
    }

    // Smart Autofill Functions
    function autoFillStudentName() {
      const studentId = document.getElementById('studentId').value;
      document.getElementById('studentName').value = studentsMap[studentId] || '';
    }

    /* --- RENDER TABLE --- */
    function renderTable(data) {
      mapList = data || [];
      const tbody = document.getElementById('tableBody');
      const loading = document.getElementById('loading');
      const table = document.getElementById('mappingTable');
      const countBadge = document.getElementById('mapCount');

      loading.style.display = 'none';
      table.style.display = 'table';
      countBadge.innerText = mapList.length;

      tbody.innerHTML = '';
      if(mapList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="9" style="text-align:center; padding:30px; color:#64748b;">No parent mappings found.</td></tr>`;
        return;
      }

      mapList.forEach(row => {
        const tr = document.createElement('tr');
        tr.setAttribute('data-mapping-id', row.mappingId);
        
        let primaryBadge = row.isPrimary ? '<span class="badge badge-primary">Yes</span>' : '<span class="badge badge-secondary">No</span>';
        let billingBadge = row.billing === 'Yes' ? '<span class="badge badge-yes">Yes</span>' : '<span class="badge badge-no">No</span>';

        tr.innerHTML = `
          <td><strong>${row.mappingId}</strong></td>
          <td>${row.parentUserId}</td>
          <td>${row.parentName || '-'}</td>
          <td>${row.studentId}</td>
          <td>${row.studentName}</td>
          <td>${row.relationship}</td>
          <td>${primaryBadge}</td>
          <td>${billingBadge}</td>
          <td style="text-align: center;">
            <div class="actions-cell">
              <button class="action-icon-btn edit-btn" onclick="openEditModal('${row.mappingId}')" title="Edit Mapping">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              </button>
              <button class="action-icon-btn delete-btn" onclick="openDeleteModal('${row.mappingId}')" title="Delete Mapping">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
      filterTable();
      try { if (window._pendingOpen && window._pendingOpen.type === 'parent') { openParentRecord(window._pendingOpen.mappingId); window._pendingOpen = null; } } catch (e) { console.warn('openParentRecord failed', e); }
    }

    function filterTable() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.querySelectorAll('#tableBody tr');
      const countBadge = document.getElementById('mapCount');
      let visibleCount = 0;

      rows.forEach(row => {
        if (row.cells.length === 1 && row.cells[0].getAttribute('colspan')) return;
        if(row.innerText.toLowerCase().includes(searchVal)) {
          row.style.display = ''; visibleCount++;
        } else {
          row.style.display = 'none';
        }
      });
      countBadge.innerText = visibleCount;
    }

    /* --- Additional window-scoped modal functions (already defined above) --- */
    window.openEditModal = function(mappingId) {
      const map = mapList.find(m => m.mappingId === mappingId);
      if (!map) return alert('Error: Mapping not found.');

      document.getElementById('formMappingId').value = map.mappingId;
      document.getElementById('parentUserId').value = map.parentUserId;
      // Allow user to edit parent name - don't auto-fill from usersMap
      document.getElementById('parentNameDisplay').value = map.parentName || '';
      document.getElementById('studentId').value = map.studentId;
      document.getElementById('studentName').value = map.studentName;
      document.getElementById('relationship').value = map.relationship;
      document.getElementById('isPrimary').value = map.isPrimary ? 'TRUE' : 'FALSE';
      document.getElementById('billing').value = map.billing;

      document.getElementById('modalTitle').innerText = 'Edit Parent Mapping';
      document.getElementById('saveBtn').innerText = 'Update Mapping';
      document.getElementById('mapModal').classList.add('active');
    }

    // Exposed for parent shell to open a parent mapping
    window.openParentRecord = function(mappingId) {
      if (!mappingId) return;
      const map = mapList.find(m => m.mappingId === mappingId);
      if (map) {
        openEditModal(map.mappingId);
        const tr = document.querySelector(`tr[data-mapping-id="${mappingId}"]`);
        if (tr) { tr.scrollIntoView({ behavior: 'smooth', block: 'center' }); tr.style.boxShadow = 'inset 0 0 0 3px rgba(59,130,246,0.08)'; setTimeout(() => tr.style.boxShadow = '', 3000); }
        return;
      }
      window._pendingOpen = { type: 'parent', mappingId: mappingId };
      refreshData();
    };

    function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.innerText = 'Saving...';
      
      const mappingId = document.getElementById('formMappingId').value;
      const data = {
        parentUserId: document.getElementById('parentUserId').value,
        parentName: document.getElementById('parentNameDisplay').value,
        studentId: document.getElementById('studentId').value,
        studentName: document.getElementById('studentName').value,
        relationship: document.getElementById('relationship').value,
        isPrimary: document.getElementById('isPrimary').value === 'TRUE',
        billing: document.getElementById('billing').value
      };

      if (mappingId) {
        // Update
        google.script.run
          .withSuccessHandler(function(res) {
            btn.disabled = false; btn.innerText = 'Update Mapping';
            if(res.success) { closeModal(); refreshData(); }
          })
          .withFailureHandler(function(err) { btn.disabled = false; btn.innerText = 'Update Mapping'; alert('Error: ' + err.message); })
          .updateParentMapping(mappingId, data);
      } else {
        // Add
        google.script.run
          .withSuccessHandler(function(res) {
            btn.disabled = false; btn.innerText = 'Save Mapping';
            if(res.success) { closeModal(); refreshData(); alert(`Mapping created! ID: ${res.mappingId}`); }
          })
          .withFailureHandler(function(err) { btn.disabled = false; btn.innerText = 'Save Mapping'; alert('Error: ' + err.message); })
          .addParentMapping(data);
      }
    }

    /* --- DELETE LOGIC (using window-scoped functions defined above) --- */
    document.getElementById('confirmDeleteBtn').onclick = function() {
      if (!currentDeleteId) return;
      const btn = this; btn.disabled = true; btn.innerText = 'Deleting...';
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false; btn.innerText = 'Delete';
          if(res.success) { closeDeleteModal(); refreshData(); }
        })
        .withFailureHandler(function(err) { btn.disabled = false; btn.innerText = 'Delete'; alert('Error: ' + err.message); })
        .deleteParentMapping(currentDeleteId);
    };
  </script>
</body>
</html>
