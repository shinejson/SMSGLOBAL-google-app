<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: #f4f7fc; padding: 40px; height: 100vh; overflow-x: hidden; }

    /* --- PAGE HEADER --- */
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .page-title { font-size: 22px; color: #0f172a; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .page-title span { color: #64748b; font-weight: 400; font-size: 16px; background: #e2e8f0; padding: 2px 10px; border-radius: 20px; }
    .action-btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .action-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); }

    /* --- TOOLBAR --- */
    .toolbar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 10px 10px 0 0; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; gap: 12px; margin: 0 -40px; }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .search-box { display: flex; align-items: center; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 8px; width: 250px; background: #f8fafc; }
    .search-box input { border: none; outline: none; background: transparent; width: 100%; margin-left: 8px; font-size: 14px; color: #333; }
    .form-input, .form-select { padding: 8px 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; color: #0f172a; background: #fff; outline: none; transition: border-color 0.2s; }
    .form-input:focus, .form-select:focus { border-color: #3b82f6; }

    /* --- TABLE --- */
    .table-container { background: white; border-radius: 0 0 10px 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow-x: auto; margin: 0 -40px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
    th { text-align: left; padding: 16px 20px; color: #475569; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
    td { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
    tr:hover { background-color: #f8fafc; }

    /* --- BADGES --- */
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
    .status-present { background: #dcfce7; color: #166534; }
    .status-absent { background: #fee2e2; color: #991b1b; }
    .status-late { background: #fef9c3; color: #854d0e; }

    /* --- LOADING --- */
    #loading { text-align: center; padding: 40px; color: #64748b; }

    /* --- MODALS --- */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: white; width: 92%; max-width: 620px; border-radius: 14px; box-shadow: 0 24px 40px -15px rgba(15, 23, 42, 0.15); transform: scale(0.95); transition: transform 0.25s ease, box-shadow 0.25s ease; overflow: hidden; display: flex; flex-direction: column; }
    .modal-backdrop.active .modal-content { transform: scale(1); }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 18px; color: #0f172a; font-weight: 700; letter-spacing: 0.02em; margin: 0; }
    .modal-close { color: #94a3b8; font-size: 24px; background: none; border: none; cursor: pointer; transition: color 0.15s; padding: 4px; line-height: 1; }
    .modal-close:hover { color: #334155; }
    .modal-body { padding: 22px 20px 20px; max-height: 72vh; overflow-y: auto; }
    .modal-footer { padding: 14px 20px; border-top: 1px solid #e2e8f0; background: #f8fafc; display: flex; justify-content: flex-end; gap: 10px; }
    .btn { padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; }
    
    .modal-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .modal-grid.three-col { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .info-note { display: block; margin-top: 6px; font-size: 12px; color: #64748b; }
    .form-group { margin-bottom: 0; }

    /* --- CLASS ROSTER --- */
    .roster-wrap { margin-top: 16px; border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; }
    .roster-header { display: grid; grid-template-columns: 2fr repeat(3, 1fr); gap: 0; background: #f1f5f9; padding: 10px 14px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; color: #475569; }
    .roster-header > div:not(:first-child) { text-align: center; }
    .roster-body { max-height: 300px; overflow-y: auto; }
    .roster-row { display: grid; grid-template-columns: 2fr repeat(3, 1fr); gap: 0; align-items: center; padding: 10px 14px; border-top: 1px solid #f1f5f9; transition: background 0.15s; }
    .roster-row:hover { background: #f8fafc; }
    .roster-row .student-info { font-size: 13px; }
    .roster-row .student-info .sid { font-size: 11px; color: #64748b; }
    /* Duplicate warning style */
    .roster-row.is-duplicate { background: #fffbeb; opacity: 0.85; }
    .roster-row.is-duplicate .student-info::after { content: ' ⚠ Already recorded'; font-size: 10px; font-weight: 700; color: #b45309; margin-left: 6px; }
    .roster-row.is-duplicate .status-pill label { opacity: 0.4; pointer-events: none; }
    .status-pill { display: flex; align-items: center; justify-content: center; }
    .status-pill input[type=radio] { display: none; }
    .status-pill label { padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #d1d5db; background: #f8fafc; color: #64748b; transition: all 0.15s; user-select: none; }
    .status-pill input[type=radio]:checked + label.present-lbl { background: #dcfce7; color: #166534; border-color: #86efac; }
    .status-pill input[type=radio]:checked + label.absent-lbl  { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
    .status-pill input[type=radio]:checked + label.late-lbl    { background: #fef9c3; color: #854d0e; border-color: #fde047; }
    .roster-empty { padding: 24px; text-align: center; color: #94a3b8; font-size: 13px; }
    .mark-all-bar { display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-size: 12px; color: #475569; }
    .mark-all-bar button { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid; transition: all 0.15s; }
    .mark-all-bar .ma-present { background: #dcfce7; color: #166534; border-color: #86efac; }
    .mark-all-bar .ma-absent  { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
    .mark-all-bar .ma-late    { background: #fef9c3; color: #854d0e; border-color: #fde047; }
    .form-label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #475569; margin-bottom: 6px; letter-spacing: 0.5px; }
    .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; color: #1e293b; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }

    /* Make input and select elements full width inside modal bodies */
    .modal-body .form-input,
    .modal-body .form-select {
      width: 100%;
    }

    /* --- ACTION ICONS --- */
    .actions-cell { display: flex; align-items: center; gap: 4px; }
    .action-icon-btn { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 6px; color: #64748b; display: inline-flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .action-icon-btn:hover { transform: scale(1.1); }
    .action-icon-btn.edit-btn:hover { background: #eff6ff; color: #2563eb; }
    .action-icon-btn.delete-btn:hover { background: #fef2f2; color: #dc2626; }

    /* --- TOAST NOTIFICATIONS --- */
    .toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      min-width: 320px;
      max-width: 440px;
      background: white;
      color: #0f172a;
      padding: 14px 18px;
      border-radius: 10px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 5px solid #10b981;
      transform: translateX(120%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      opacity: 0;
    }
    .toast.active { transform: translateX(0); opacity: 1; }
    .toast.toast-error { border-left-color: #ef4444; }
    .toast.toast-warning { border-left-color: #f59e0b; }
    .toast-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #dcfce7;
      color: #166534;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }
    .toast.toast-error .toast-icon { background: #fee2e2; color: #991b1b; }
    .toast.toast-warning .toast-icon { background: #fef9c3; color: #854d0e; }
    .toast-message { flex: 1; font-size: 14px; line-height: 1.4; }
    .toast-close { background: none; border: none; color: #94a3b8; font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1; }
    .toast-close:hover { color: #475569; }

    /* --- RESPONSIVE --- */
    @media (max-width: 768px) {
      body { padding: 20px; }
      .table-container { margin: 0 -20px; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .toolbar { flex-direction: column; align-items: flex-start; }
      .toolbar-left, .toolbar-right { width: 100%; flex-direction: column; }
      .search-box { width: 100%; }
      .form-input, .form-select { width: 100%; }
    }

    /* --- DARK MODE STYLES --- */
    body.dark-mode { background-color: #0f172a; color: #f1f5f9; }
    body.dark-mode .page-title { color: #f1f5f9; }
    body.dark-mode .page-title span { background: #1e293b; color: #94a3b8; }
    body.dark-mode .toolbar { background: #1e293b; border-bottom-color: #334155; }
    body.dark-mode .search-box { background: #0f172a; border-color: #334155; }
    body.dark-mode .search-box input { color: #f1f5f9; }
    body.dark-mode .form-input, body.dark-mode .form-select { background: #1e293b; border-color: #334155; color: #f1f5f9; }
    body.dark-mode .table-container { background: #1e293b; }
    body.dark-mode thead { background: #0f172a; border-bottom-color: #334155; }
    body.dark-mode th { color: #94a3b8; }
    body.dark-mode td { color: #f1f5f9; border-bottom-color: #334155; }
    body.dark-mode tr:hover { background-color: #334155; }
    body.dark-mode .modal-content { background: #1e293b; }
    body.dark-mode .modal-header { border-bottom-color: #334155; }
    body.dark-mode .modal-header h3 { color: #f1f5f9; }
    body.dark-mode .modal-body { color: #f1f5f9; }
    body.dark-mode .modal-footer { background: #0f172a; border-top-color: #334155; }
    body.dark-mode .form-label { color: #94a3b8; }
    body.dark-mode .btn-secondary { background: #334155; color: #f1f5f9; }
    body.dark-mode .btn-secondary:hover { background: #475569; }
    body.dark-mode .roster-wrap { border-color: #334155; }
    body.dark-mode .roster-header { background: #0f172a; color: #94a3b8; }
    body.dark-mode .roster-row { border-top-color: #334155; }
    body.dark-mode .roster-row:hover { background: #1e293b; }
    body.dark-mode .roster-row .student-info { color: #f1f5f9; }
    body.dark-mode .roster-row .student-info .sid { color: #94a3b8; }
    body.dark-mode .roster-row.is-duplicate { background: #422006; }
    body.dark-mode .roster-empty { color: #64748b; }
    body.dark-mode .mark-all-bar { background: #0f172a; border-bottom-color: #334155; color: #94a3b8; }
    body.dark-mode .status-pill label { background: #0f172a; border-color: #334155; color: #94a3b8; }
    body.dark-mode .toast { background: #1e293b; color: #f1f5f9; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4); }
    body.dark-mode .toast-message { color: #cbd5e1; }
    body.dark-mode .action-icon-btn { color: #94a3b8; }
    body.dark-mode .action-icon-btn.edit-btn:hover { background: #1e3a8a; color: #60a5fa; }
    body.dark-mode .action-icon-btn.delete-btn:hover { background: #7f1d1d; color: #fca5a5; }
    body.dark-mode #loading { color: #94a3b8; }
  </style>
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <!-- HEADER -->
  <div class="page-header">
    <div class="page-title">
      ✅ Attendance Records
      <span id="attendanceCount">0</span>
    </div>
    <button class="action-btn" onclick="openAddModal()">+ Mark Attendance</button>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Search ID, Course, or Status..." onkeyup="filterTable()">
      </div>
    </div>
    <div class="toolbar-right">
      <input type="date" id="dateFilter" class="form-input" onchange="filterTable()">
      <select id="academicYearFilter" class="form-select" onchange="filterTable()">
        <option value="">All Years</option>
      </select>
      <select id="classFilter" class="form-select" onchange="filterTable()">
        <option value="">All Classes</option>
      </select>
      <select id="termFilter" class="form-select" onchange="filterTable()">
        <option value="">All Terms</option>
      </select>
      <select id="statusFilter" class="form-select" onchange="filterTable()">
        <option value="">All Statuses</option>
        <!-- Statuses loaded dynamically from settings -->
      </select>
      <input type="text" id="exportFolderId" class="form-input" placeholder="Export Folder ID">
      <button class="action-btn" style="background:#10b981;" onclick="exportPdf()">Export PDF</button>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-container">
    <div id="loading">Loading attendance data...</div>
    <table id="attendanceTable" style="display:none;">
      <thead>
        <tr>
          <th>Attendance ID</th>
          <th>Date</th>
          <th>Academic Year</th>
          <th>Class</th>
          <th>Student</th>
          <th>Course ID</th>
          <th>Status</th>
          <th>Term</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- ADD ATTENDANCE MODAL (Bulk — one row per student in class) -->
  <div class="modal-backdrop" id="attendanceModal">
    <div class="modal-content" style="max-width:700px;">
      <div class="modal-header">
        <h3>Mark Attendance</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="attendanceForm" onsubmit="handleSubmit(event)">
        <div class="modal-body">
          <!-- Session fields -->
          <div class="modal-grid three-col">
            <div class="form-group">
              <label class="form-label" for="attendanceDate">Date</label>
              <input type="date" id="attendanceDate" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="academicYear">Academic Year <span style="font-weight:400;text-transform:none;">(Active)</span></label>
              <select id="academicYear" class="form-select" required>
                <option value="" disabled selected>Select Year</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="courseSelect">Course <span style="font-weight:400;text-transform:none;">(optional)</span></label>
              <select id="courseSelect" class="form-select">
                <option value="">Select a Course</option>
              </select>
            </div>
          </div>
          <div class="modal-grid" style="margin-top:14px;">
            <div class="form-group">
              <label class="form-label" for="className">Class</label>
              <select id="className" class="form-select" required onchange="renderClassRoster()">
                <option value="" disabled selected>-- Select Class --</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="term">Term</label>
              <select id="term" class="form-select" required>
                <option value="" disabled selected>Select Term</option>
                <option value="Term 1">Term 1</option>
                <option value="Term 2">Term 2</option>
                <option value="Term 3">Term 3</option>
              </select>
            </div>
          </div>

          <!-- Student roster (rendered dynamically on class select) -->
          <div id="rosterSection" style="margin-top:16px; display:none;">
            <div style="font-size:12px;font-weight:700;text-transform:uppercase;color:#475569;letter-spacing:0.5px;margin-bottom:8px;">Student Roster <span id="rosterCount" style="font-weight:400;color:#94a3b8;"></span></div>
            <div class="roster-wrap">
              <div class="mark-all-bar" id="markAllBar">
                <span>Mark all:</span>
                <!-- Buttons loaded dynamically from status settings -->
              </div>
              <div class="roster-header" id="rosterHeader">
                <div>Student</div>
                <!-- Status columns loaded dynamically -->
              </div>
              <div class="roster-body" id="rosterBody"></div>
            </div>
          </div>
          <div id="rosterPlaceholder" style="margin-top:16px;padding:20px;text-align:center;color:#94a3b8;font-size:13px;border:1px dashed #e2e8f0;border-radius:10px;">Select a class above to load the student roster.</div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Attendance</button>
        </div>
      </form>
    </div>
  </div>

  <!-- EDIT SINGLE ATTENDANCE MODAL -->
  <div class="modal-backdrop" id="editAttendanceModal">
    <div class="modal-content" style="max-width:480px;">
      <div class="modal-header">
        <h3>Edit Attendance</h3>
        <button class="modal-close" onclick="closeEditModal()">&times;</button>
      </div>
      <form id="editAttendanceForm" onsubmit="handleEditSubmit(event)">
        <div class="modal-body">
          <input type="hidden" id="edit_attendanceId">
          <div class="modal-grid" style="margin-bottom:14px;">
            <div class="form-group">
              <label class="form-label">Date</label>
              <input type="date" id="edit_date" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label">Academic Year</label>
              <select id="edit_academicYear" class="form-select"></select>
            </div>
          </div>
          <div class="modal-grid" style="margin-bottom:14px;">
            <div class="form-group">
              <label class="form-label">Class</label>
              <select id="edit_className" class="form-select"></select>
            </div>
            <div class="form-group">
              <label class="form-label">Term</label>
              <select id="edit_term" class="form-select">
                <option value="Term 1">Term 1</option>
                <option value="Term 2">Term 2</option>
                <option value="Term 3">Term 3</option>
              </select>
            </div>
          </div>
          <div class="form-group" style="margin-bottom:14px;">
            <label class="form-label">Student</label>
            <input type="text" id="edit_studentDisplay" class="form-input" readonly style="background:#f8fafc;">
          </div>
          <div class="form-group" style="margin-bottom:14px;">
            <label class="form-label">Course (optional)</label>
            <select id="edit_courseSelect" class="form-select"></select>
          </div>
          <div class="form-group">
            <label class="form-label">Status</label>
            <select id="edit_status" class="form-select" required>
              <!-- Status options loaded dynamically -->
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="editSaveBtn">Update Record</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let attendanceList = [];
    let studentsList = [];
    let attendanceStatuses = []; // Dynamic statuses from settings
    let activeAcademicYear = '';

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = 'toast' + (type === 'error' ? ' toast-error' : type === 'warning' ? ' toast-warning' : '');
      const icon = type === 'error' ? '✕' : type === 'warning' ? '⚠' : '✓';
      toast.innerHTML = `
        <div class="toast-icon">${icon}</div>
        <div class="toast-message">${message}</div>
        <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
      `;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('active'), 10);
      setTimeout(() => {
        toast.classList.remove('active');
        setTimeout(() => toast.remove(), 300);
      }, 4500);
    }

    function applyDefaultFilters() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('dateFilter').value = today;
      if (activeAcademicYear) {
        const yearSel = document.getElementById('academicYearFilter');
        const hasOption = Array.from(yearSel.options).some(o => o.value === activeAcademicYear);
        if (hasOption) yearSel.value = activeAcademicYear;
      }

    // --- FILTERS ---
    function normalizeDateStr(dStr) {
      if (!dStr) return '';
      dStr = String(dStr).trim();
      if (/^\d{4}-\d{2}-\d{2}/.test(dStr)) return dStr.substring(0, 10);
      const parts = dStr.split(/[\/\-\.]/);
      if (parts.length === 3) {
        let m, d, y;
        if (parts[0].length === 4) {
          y = parts[0]; m = parts[1].padStart(2, '0'); d = parts[2].padStart(2, '0');
        } else {
          m = parts[0].padStart(2, '0'); d = parts[1].padStart(2, '0'); y = parts[2];
        }
        if (y && m && d && y.length === 4) return `${y}-${m}-${d}`;
      }
      return dStr;
    }

    function filterTable() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const statusVal = document.getElementById('statusFilter').value.toLowerCase();
      const academicYearVal = document.getElementById('academicYearFilter').value;
      const classVal = document.getElementById('classFilter').value;
      const termVal = document.getElementById('termFilter').value;
      const rawDateVal = document.getElementById('dateFilter').value;
      const normDateVal = normalizeDateStr(rawDateVal);
      const rows = document.querySelectorAll('#tableBody tr');
      const countBadge = document.getElementById('attendanceCount');

      let visibleCount = 0;
      rows.forEach(row => {
        if (row.cells.length === 1 && row.cells[0].getAttribute('colspan')) return;

        const text = row.innerText.toLowerCase();
        const rowStatus = (row.getAttribute('data-status') || '').toLowerCase();
        const rowDate = (row.getAttribute('data-date') || '');
        const normRowDate = normalizeDateStr(rowDate);
        const rowYear = (row.getAttribute('data-academicyear') || '');
        const rowClass = (row.getAttribute('data-classname') || '');
        const rowTerm = (row.getAttribute('data-term') || '');

        const matchSearch = text.includes(searchVal);
        const matchStatus = statusVal === '' || rowStatus === statusVal;
        const matchDate = normDateVal === '' || normRowDate === normDateVal;
        const matchYear = academicYearVal === '' || rowYear === academicYearVal;
        const matchClass = classVal === '' || rowClass === classVal;
        const matchTerm = termVal === '' || rowTerm === termVal;

        if (matchSearch && matchStatus && matchDate && matchYear && matchClass && matchTerm) {
          row.style.display = ''; visibleCount++;
        } else {
          row.style.display = 'none';
        }
      });
      countBadge.innerText = visibleCount;
    }

    /* ---- Mark duplicate rows in roster when date/class changes ---- */
    function markDuplicatesInRoster() {
      const date      = document.getElementById('attendanceDate').value;
      const className = document.getElementById('className').value;
      if (!date || !className) return;

      // Build a Set of studentIds already recorded for this date
      const alreadyRecorded = new Set(
        attendanceList
          .filter(r => formatDisplayDate(r.date) === date && r.className === className)
          .map(r => r.studentId)
      );

      document.querySelectorAll('#rosterBody .roster-row').forEach(row => {
        const sid = row.dataset.studentId;
        if (alreadyRecorded.has(sid)) {
          row.classList.add('is-duplicate');
          row.dataset.isDuplicate = 'true';
        } else {
          row.classList.remove('is-duplicate');
          delete row.dataset.isDuplicate;
        }
      });

      // Show count of duplicates in roster header
      const dupeCount = alreadyRecorded.size;
      const rosterCount = document.getElementById('rosterCount');
      if (rosterCount && dupeCount > 0) {
        const total = document.querySelectorAll('#rosterBody .roster-row').length;
        rosterCount.innerHTML = `(${total} students &nbsp;·&nbsp; <span style="color:#b45309;">⚠ ${dupeCount} already recorded today</span>)`;
      }
    }

    /* ---- BULK SUBMIT (one record per roster row, skips duplicates) ---- */
    function handleSubmit(e) {
      e.preventDefault();

      const rows = document.querySelectorAll('#rosterBody .roster-row');
      if (rows.length === 0) {
        showToast('Please select a class to load the student roster first.', 'warning');
        return;
      }

      const date         = document.getElementById('attendanceDate').value;
      const academicYear = document.getElementById('academicYear').value;
      const courseId     = document.getElementById('courseSelect').value;
      const className    = document.getElementById('className').value;
      const term         = document.getElementById('term').value;

      if (!date || !academicYear || !className || !term) {
        showToast('Please fill in Date, Academic Year, Class and Term.', 'warning');
        return;
      }

      // ---- CLIENT-SIDE DUPLICATE CHECK ----
      const alreadyRecorded = new Set(
        attendanceList
          .filter(r => formatDisplayDate(r.date) === date && r.className === className)
          .map(r => r.studentId)
      );

      // Build arrays: new records to save, and duplicates to skip
      const records   = [];
      const skipped   = [];
      rows.forEach(row => {
        const sid    = row.dataset.studentId;
        const name   = row.dataset.fullName;
        const radio  = row.querySelector(`input[name="stu_${sid}"]:checked`);
        const status = radio ? radio.value : 'Present';
        if (alreadyRecorded.has(sid)) {
          skipped.push(name || sid);
        } else {
          records.push({ date, studentId: sid, studentName: name, courseId, academicYear, className, term, status });
        }
      });

      // If everyone is already recorded, stop
      if (records.length === 0) {
        showToast(`Attendance for all ${skipped.length} student(s) has already been recorded on ${date}.`, 'warning');
        return;
      }

      // Warn about partial skips
      if (skipped.length > 0) {
        const proceed = confirm(
          `⚠ ${skipped.length} student(s) already have attendance on ${date} and will be SKIPPED:\n• ${skipped.join('\n• ')}\n\nSave attendance for the remaining ${records.length} student(s)?`
        );
        if (!proceed) return;
      }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.innerText = `Saving ${records.length} records...`;

      let saved  = 0;
      let errors = [];

      function saveNext(idx) {
        if (idx >= records.length) {
          btn.disabled = false; btn.innerText = 'Save Attendance';
          const skipMsg = skipped.length ? `\n${skipped.length} skipped (already recorded).` : '';
          if (errors.length) {
            showToast(`Saved ${saved}/${records.length}.${skipMsg.replace('\n', ' ')} Errors: ${errors.join('; ')}`, 'error');
          } else {
            closeModal();
            const msg = skipped.length
              ? `Attendance saved for ${saved} student(s). ${skipped.length} skipped (already recorded).`
              : `Attendance saved for ${saved} student(s).`;
            showToast(msg, 'success');
          }
          refreshData();
          return;
        }
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.requiresAdminOverride && !records[idx].__adminAcademicYearOverride) {
              const proceed = confirm((res.message || 'This action needs admin confirmation.') + '\n\nClick OK to continue as Admin, or Cancel to stop.');
              if (!proceed) {
                btn.disabled = false;
                btn.innerText = 'Save Attendance';
                showToast('Attendance save cancelled.', 'warning');
                return;
              }
              records.forEach(function(record) {
                record.__adminAcademicYearOverride = true;
              });
              saveNext(idx);
              return;
            }
            if (res && res.success) saved++;
            else errors.push(records[idx].studentId + ': ' + (res && res.message ? res.message : 'failed'));
            saveNext(idx + 1);
          })
          .withFailureHandler(function(err) {
            errors.push(records[idx].studentId + ': ' + (err && err.message ? err.message : 'error'));
            saveNext(idx + 1);
          })
          .addAttendance(records[idx]);
      }

      saveNext(0);
    }

    function handleEditSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('editSaveBtn');
      btn.disabled = true; btn.innerText = 'Saving...';

      const attendanceId = document.getElementById('edit_attendanceId').value;
      const data = {
        date:         document.getElementById('edit_date').value,
        academicYear: document.getElementById('edit_academicYear').value,
        className:    document.getElementById('edit_className').value,
        term:         document.getElementById('edit_term').value,
        courseId:     document.getElementById('edit_courseSelect').value,
        status:       document.getElementById('edit_status').value
      };
      // Preserve studentId/studentName from the original record
      const record = attendanceList.find(r => r.attendanceId === attendanceId);
      if (record) { data.studentId = record.studentId; data.studentName = record.studentName; }

      function submitEdit(payload) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.requiresAdminOverride && !payload.__adminAcademicYearOverride) {
              const proceed = confirm((res.message || 'This action needs admin confirmation.') + '\n\nClick OK to continue as Admin, or Cancel to stop.');
              if (!proceed) {
                btn.disabled = false; btn.innerText = 'Update Record';
                showToast('Attendance update cancelled.', 'warning');
                return;
              }
              payload.__adminAcademicYearOverride = true;
              submitEdit(payload);
              return;
            }
            btn.disabled = false; btn.innerText = 'Update Record';
            if (res && res.success) { closeEditModal(); refreshData(); showToast('Attendance updated successfully!', 'success'); }
            else { showToast(res && res.message ? res.message : 'Update failed.', 'error'); }
          })
          .withFailureHandler(function(err) {
            btn.disabled = false; btn.innerText = 'Update Record';
            showToast('Error: ' + (err && err.message ? err.message : 'Unknown'), 'error');
          })
          .updateAttendance(attendanceId, payload);
      }

      submitEdit(data);
    }

    function deleteAttendanceRecord(attendanceId) {
      if (!confirm('Are you sure you want to delete this attendance record?')) return;

      function submitDelete(options) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.requiresAdminOverride && !(options && options.adminAcademicYearOverride)) {
              const proceed = confirm((res.message || 'This action needs admin confirmation.') + '\n\nClick OK to continue as Admin, or Cancel to stop.');
              if (!proceed) {
                showToast('Attendance delete cancelled.', 'warning');
                return;
              }
              submitDelete({ adminAcademicYearOverride: true });
              return;
            }
            if (res.success) { refreshData(); showToast('Attendance record deleted.', 'success'); }
            else { showToast(res.message || 'Could not delete record.', 'error'); }
          })
          .withFailureHandler(function(err) { showToast('Error: ' + err.message, 'error'); })
          .deleteAttendance(attendanceId, options || null);
      }

      submitDelete(null);
    }
  </script>
</body>
</html>
