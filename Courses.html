<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: #f4f7fc; padding: 40px; height: 100vh; overflow-x: hidden; }

    /* --- PAGE HEADER --- */
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .page-title { font-size: 22px; color: #0f172a; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .page-title span { color: #64748b; font-weight: 400; font-size: 16px; background: #e2e8f0; padding: 2px 10px; border-radius: 20px; }
    .action-btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .action-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); }

    /* --- TOOLBAR --- */
    .toolbar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 10px 10px 0 0; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; gap: 12px; margin: 0 -40px; }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .search-box { display: flex; align-items: center; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 8px; width: 300px; background: #f8fafc; }
    .search-box input { border: none; outline: none; background: transparent; width: 100%; margin-left: 8px; font-size: 14px; color: #333; }
    .form-select { padding: 8px 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; color: #0f172a; background: #fff; outline: none; transition: border-color 0.2s; }
    .form-select:focus { border-color: #3b82f6; }

    /* --- TABLE --- */
    .table-container { background: white; border-radius: 0 0 10px 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow-x: auto; margin: 0 -40px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
    th { text-align: left; padding: 16px 20px; color: #475569; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
    td { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
    tr:hover { background-color: #f8fafc; }

    /* --- BADGES --- */
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
    .status-active { background: #dcfce7; color: #166534; }
    .status-inactive { background: #fee2e2; color: #991b1b; }

    /* --- LOADING --- */
    #loading { text-align: center; padding: 40px; color: #64748b; }

    /* --- MODALS --- */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: white; width: 90%; max-width: 550px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); transform: scale(0.95); transition: transform 0.25s ease; overflow: hidden; display: flex; flex-direction: column; }
    .modal-backdrop.active .modal-content { transform: scale(1); }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 18px; color: #0f172a; font-weight: 600; }
    .modal-close { color: #94a3b8; font-size: 24px; background: none; border: none; cursor: pointer; transition: color 0.15s; }
    .modal-close:hover { color: #334155; }
    .modal-body { padding: 24px; max-height: 70vh; overflow-y: auto; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid #f1f5f9; background: #f8fafc; display: flex; justify-content: flex-end; gap: 12px; }
    
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #475569; margin-bottom: 6px; letter-spacing: 0.5px; }
    .form-input, .form-select { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; color: #0f172a; background: #fff; transition: border-color 0.15s, box-shadow 0.15s; }
    .form-input:focus, .form-select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    
    .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; color: #1e293b; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }

    /* --- TOAST NOTIFICATIONS --- */
    .toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      min-width: 320px;
      max-width: 440px;
      background: white;
      color: #0f172a;
      padding: 14px 18px;
      border-radius: 10px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 5px solid #10b981;
      transform: translateX(120%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      opacity: 0;
    }
    .toast.active {
      transform: translateX(0);
      opacity: 1;
    }
    .toast-error {
      border-left-color: #ef4444;
    }
    .toast-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #dcfce7;
      color: #166534;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      flex-shrink: 0;
    }
    .toast-error .toast-icon {
      background: #fee2e2;
      color: #991b1b;
    }
    .toast-message {
      font-size: 14px;
      font-weight: 500;
      color: #1e293b;
      flex: 1;
      line-height: 1.4;
    }
    .toast-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    .toast-close:hover {
      color: #334155;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 768px) {
      body { padding: 20px; }
      .table-container { margin: 0 -20px; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .toolbar { flex-direction: column; align-items: flex-start; }
      .toolbar-left, .toolbar-right { width: 100%; flex-direction: column; }
      .search-box { width: 100%; }
      .form-grid { grid-template-columns: 1fr; }
      .toast-container { top: 16px; right: 16px; left: 16px; }
      .toast { min-width: auto; max-width: 100%; }
    }

    /* --- DARK MODE --- */
    body.dark-mode { background-color: #0f172a; color: #f1f5f9; }
    body.dark-mode .page-title { color: #f1f5f9; }
    body.dark-mode .page-title span { background: #334155; color: #94a3b8; }
    body.dark-mode .toolbar { background: #1e293b; border-bottom-color: #334155; }
    body.dark-mode .search-box { background: #0f172a; border-color: #334155; }
    body.dark-mode .search-box input { color: #f1f5f9; }
    body.dark-mode .search-box input::placeholder { color: #64748b; }
    body.dark-mode .table-container { background: #1e293b; }
    body.dark-mode thead { background: #0f172a; border-bottom-color: #334155; }
    body.dark-mode th { color: #94a3b8; }
    body.dark-mode td { border-bottom-color: #334155; color: #f1f5f9; }
    body.dark-mode tr:hover { background-color: #334155; }
    body.dark-mode #loading { color: #94a3b8; }
    body.dark-mode .form-select { background: #0f172a; border-color: #334155; color: #f1f5f9; }
    body.dark-mode .form-select:focus { border-color: #3b82f6; }
    body.dark-mode .modal-content { background: #1e293b; }
    body.dark-mode .modal-header { border-bottom-color: #334155; }
    body.dark-mode .modal-header h3 { color: #f1f5f9; }
    body.dark-mode .modal-close { color: #94a3b8; }
    body.dark-mode .modal-close:hover { color: #f1f5f9; }
    body.dark-mode .modal-footer { background: #0f172a; border-top-color: #334155; }
    body.dark-mode .form-label { color: #94a3b8; }
    body.dark-mode .form-input { background: #0f172a; border-color: #334155; color: #f1f5f9; }
    body.dark-mode .form-input:focus { border-color: #3b82f6; }
    body.dark-mode .btn-secondary { background: #334155; color: #f1f5f9; }
    body.dark-mode .btn-secondary:hover { background: #475569; }
    body.dark-mode .toast { background: #1e293b; color: #f1f5f9; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    body.dark-mode .toast-message { color: #f1f5f9; }
  </style>
</head>
<body>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- HEADER -->
  <div class="page-header">
    <div class="page-title">
      📘 Course Catalog
      <span id="courseCount">0</span>
    </div>
    <button class="action-btn" onclick="openAddModal()">+ Add Course</button>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Search by Name, Instructor, or ID..." onkeyup="filterTable()">
      </div>
    </div>
    <div class="toolbar-right">
      <select id="statusFilter" class="form-select" onchange="filterTable()">
        <option value="">All Statuses</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-container">
    <div id="loading">Loading course data...</div>
    <table id="courseTable" style="display:none;">
      <thead>
        <tr>
          <th>Course ID</th>
          <th>Course Name</th>
          <th>Instructor</th>
          <th>Credits</th>
          <th>Semester</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- ADD/EDIT COURSE MODAL -->
  <div class="modal-backdrop" id="courseModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Course</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="courseForm" onsubmit="handleSubmit(event)">
        <input type="hidden" id="formCourseId">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="courseName">Course Name</label>
              <input type="text" id="courseName" class="form-input" placeholder="e.g. Introduction to CS" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="instructor">Instructor</label>
              <input type="text" id="instructor" class="form-input" placeholder="e.g. Dr. Smith" required>
            </div>
          </div>
          
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="credits">Credits</label>
              <input type="number" id="credits" class="form-input" placeholder="e.g. 3" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="semester">Semester</label>
              <select id="semester" class="form-select" required>
                <option value="" disabled selected>Select Semester</option>
                <option value="Fall 2026">Fall 2026</option>
                <option value="Spring 2026">Spring 2026</option>
                <option value="Summer 2026">Summer 2026</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="status">Status</label>
            <select id="status" class="form-select" required>
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Course</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let courseList = [];

    document.addEventListener('DOMContentLoaded', function() {
      refreshData();
    });

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type === 'error' ? 'toast-error' : ''}`;
      
      const icon = type === 'error' ? '✕' : '✓';
      
      toast.innerHTML = `
        <div class="toast-icon">${icon}</div>
        <div class="toast-message">${message}</div>
        <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
      `;
      
      container.appendChild(toast);
      
      // Trigger animation
      setTimeout(() => toast.classList.add('active'), 10);
      
      // Auto remove after 3.5 seconds
      setTimeout(() => {
        toast.classList.remove('active');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function refreshData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('courseTable').style.display = 'none';
      google.script.run.withSuccessHandler(renderTable).getCoursesData();
    }

    // 2. Render the Table
    function renderTable(data) {
      courseList = data || [];
      const tbody = document.getElementById('tableBody');
      const loading = document.getElementById('loading');
      const table = document.getElementById('courseTable');
      const countBadge = document.getElementById('courseCount');

      loading.style.display = 'none';
      table.style.display = 'table';
      countBadge.innerText = courseList.length;

      tbody.innerHTML = '';
      
      if(courseList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; color:#64748b;">No courses found.</td></tr>`;
        return;
      }

      courseList.forEach(row => {
        const tr = document.createElement('tr');
        tr.setAttribute('data-status', row.status || '');

        let statusClass = 'status-active';
        if(row.status === 'Inactive') statusClass = 'status-inactive';

        tr.innerHTML = `
          <td><strong>${row.courseId || '-'}</strong></td>
          <td>${row.courseName || '-'}</td>
          <td>${row.instructor || '-'}</td>
          <td>${row.credits || '-'}</td>
          <td>${row.semester || '-'}</td>
          <td><span class="status-badge ${statusClass}">${row.status || 'Active'}</span></td>
        `;
        tbody.appendChild(tr);
      });
      
      filterTable();
    }

    // 3. Search/Filter Function
    function filterTable() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const statusVal = document.getElementById('statusFilter').value.toLowerCase();
      const rows = document.querySelectorAll('#tableBody tr');
      const countBadge = document.getElementById('courseCount');

      let visibleCount = 0;
      rows.forEach(row => {
        if (row.cells.length === 1 && row.cells[0].getAttribute('colspan')) return;

        const text = row.innerText.toLowerCase();
        const rowStatus = (row.getAttribute('data-status') || '').toLowerCase();

        const matchSearch = text.includes(searchVal);
        const matchStatus = statusVal === '' || rowStatus === statusVal;

        if (matchSearch && matchStatus) {
          row.style.display = ''; visibleCount++;
        } else {
          row.style.display = 'none';
        }
      });
      countBadge.innerText = visibleCount;
    }

    // --- MODAL LOGIC ---
    function openAddModal() { 
      document.getElementById('courseForm').reset();
      document.getElementById('formCourseId').value = '';
      document.getElementById('modalTitle').innerText = 'Add New Course';
      document.getElementById('saveBtn').innerText = 'Save Course';
      document.getElementById('courseModal').classList.add('active'); 
    }

    function closeModal() { document.getElementById('courseModal').classList.remove('active'); }

    function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.innerText = 'Saving...';

      const data = {
        courseName: document.getElementById('courseName').value.trim(),
        instructor: document.getElementById('instructor').value.trim(),
        credits: document.getElementById('credits').value.trim(),
        semester: document.getElementById('semester').value,
        status: document.getElementById('status').value
      };

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false; btn.innerText = 'Save Course';
          if(res.success) {
            closeModal();
            refreshData();
            showToast(`Course added successfully! ID: ${res.courseId}`, 'success');
          } else {
            showToast('Error saving course.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false; btn.innerText = 'Save Course';
          showToast('Error: ' + (err ? err.message : 'Could not save course.'), 'error');
        })
        .addCourse(data);
    }
  </script>
</body>
</html>
