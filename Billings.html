<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: #f4f7fc; padding: 40px; height: 100vh; overflow-x: hidden; }

    /* --- HEADER --- */
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .page-title { font-size: 22px; color: #0f172a; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .page-title span { color: #64748b; font-weight: 400; font-size: 16px; background: #e2e8f0; padding: 2px 10px; border-radius: 20px; }
    .action-btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .action-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); }

    /* --- TOOLBAR --- */
    .toolbar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 10px 10px 0 0; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; gap: 12px; margin: 0 -40px; padding-left: 60px; padding-right: 60px; }
    .toolbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .search-box { display: flex; align-items: center; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 8px; width: 300px; background: #f8fafc; }
    .search-box input { border: none; outline: none; background: transparent; width: 100%; margin-left: 8px; font-size: 14px; color: #333; }

    /* --- TABLE --- */
    .table-container { background: white; border-radius: 0 0 10px 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow-x: auto; margin: 0 -40px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
    th { text-align: left; padding: 16px 20px; color: #475569; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; white-space: nowrap; }
    td { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
    tr:hover { background-color: #f8fafc; }

    /* --- BADGES --- */
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
    .status-active { background: #dcfce7; color: #166534; }
    .status-inactive { background: #fee2e2; color: #991b1b; }

    /* --- ACTIONS --- */
    .actions-cell { display: flex; gap: 10px; justify-content: center; }
    .action-icon-btn { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 6px; color: #64748b; display: inline-flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .action-icon-btn:hover { transform: scale(1.1); }
    .action-icon-btn.edit-btn:hover { background: #eff6ff; color: #2563eb; }
    .action-icon-btn.delete-btn:hover { background: #fef2f2; color: #dc2626; }

    /* --- LOADING --- */
    #loading { text-align: center; padding: 40px; color: #64748b; }

    /* --- MODALS --- */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: white; width: 90%; max-width: 500px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); transform: scale(0.95); transition: transform 0.25s ease; overflow: hidden; display: flex; flex-direction: column; }
    .modal-backdrop.active .modal-content { transform: scale(1); }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 18px; color: #0f172a; font-weight: 600; }
    .modal-close { color: #94a3b8; font-size: 24px; background: none; border: none; cursor: pointer; }
    .modal-close:hover { color: #334155; }
    .modal-body { padding: 24px; max-height: 70vh; overflow-y: auto; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid #f1f5f9; background: #f8fafc; display: flex; justify-content: flex-end; gap: 12px; }
    
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #475569; margin-bottom: 6px; }
    .form-input, .form-select, .form-textarea { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; color: #0f172a; background: #fff; transition: border-color 0.15s; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; color: #1e293b; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }

    @media (max-width: 768px) {
      body { padding: 20px; }
      .table-container { margin: 0 -20px; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .toolbar { flex-direction: column; align-items: flex-start; }
      .search-box { width: 100%; }
      .form-grid-2 { grid-template-columns: 1fr; }
    }

    /* --- DARK MODE STYLES --- */
    body.dark-mode { background-color: #0f172a; color: #f1f5f9; }
    body.dark-mode .page-title { color: #f1f5f9; }
    body.dark-mode .page-title span { background: #1e293b; color: #94a3b8; }
    body.dark-mode .toolbar { background: #1e293b; border-bottom-color: #334155; }
    body.dark-mode .search-box { background: #0f172a; border-color: #334155; }
    body.dark-mode .search-box input { color: #f1f5f9; }
    body.dark-mode .form-input, body.dark-mode .form-select { background: #1e293b; border-color: #334155; color: #f1f5f9; }
    body.dark-mode .table-container { background: #1e293b; }
    body.dark-mode thead { background: #0f172a; border-bottom-color: #334155; }
    body.dark-mode th { color: #94a3b8; }
    body.dark-mode td { color: #f1f5f9; border-bottom-color: #334155; }
    body.dark-mode tr:hover { background-color: #334155; }
    body.dark-mode .modal-content { background: #1e293b; }
    body.dark-mode .modal-header { border-bottom-color: #334155; }
    body.dark-mode .modal-header h3 { color: #f1f5f9; }
    body.dark-mode .modal-footer { background: #0f172a; border-top-color: #334155; }
    body.dark-mode .form-label { color: #94a3b8; }
    body.dark-mode .btn-secondary { background: #334155; color: #f1f5f9; }

    /* --- TOAST NOTIFICATIONS --- */
    .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast { background: white; border-radius: 8px; padding: 14px 18px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); display: flex; align-items: center; gap: 12px; min-width: 300px; max-width: 400px; opacity: 0; transform: translateX(400px); transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); pointer-events: auto; border-left: 4px solid; }
    .toast.show { opacity: 1; transform: translateX(0); }
    .toast.success { border-left-color: #10b981; }
    .toast.error { border-left-color: #ef4444; }
    .toast.warning { border-left-color: #f59e0b; }
    .toast.info { border-left-color: #3b82f6; }
    .toast-icon { font-size: 20px; flex-shrink: 0; }
    .toast.success .toast-icon { color: #10b981; }
    .toast.error .toast-icon { color: #ef4444; }
    .toast.warning .toast-icon { color: #f59e0b; }
    .toast.info .toast-icon { color: #3b82f6; }
    .toast-content { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .toast-title { font-weight: 600; font-size: 14px; color: #0f172a; }
    .toast-message { font-size: 13px; color: #64748b; line-height: 1.4; }
    .toast-close { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 18px; padding: 0; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: color 0.15s; }
    .toast-close:hover { color: #475569; }
    body.dark-mode .toast { background: #1e293b; }
    body.dark-mode .toast-title { color: #f1f5f9; }
    body.dark-mode .toast-message { color: #cbd5e1; }
  </style>
</head>
<body>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- HEADER -->
  <div class="page-header">
    <div class="page-title">
      💳 Billing Items
      <span id="billingCount">0</span>
    </div>
    <button class="action-btn" onclick="openAddModal()">+ Add Billing Item</button>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Search by Item, ID, or Status..." onkeyup="filterTable()">
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-container">
    <div id="loading">Loading billing data...</div>
    <table id="billingTable" style="display:none;">
      <thead>
        <tr>
          <th>Billing ID</th>
          <th>Item</th>
          <th>Amount</th>
          <th>Status</th>
          <th>Description</th>
          <th class="text-center" style="text-align: center;">Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- ADD/EDIT MODAL -->
  <div class="modal-backdrop" id="billingModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Add Billing Item</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="billingForm" onsubmit="handleSubmit(event)">
        <input type="hidden" id="formBillingId">
        <div class="modal-body">
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="item">Item Name</label>
              <input type="text" id="item" class="form-input" placeholder="e.g. Tuition Fee" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="amount">Amount (GHS)</label>
              <input type="number" id="amount" class="form-input" placeholder="0.00" min="0" step="0.01" required>
            </div>
          </div>
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="status">Status</label>
              <select id="status" class="form-select" required>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
            <div class="form-group">
              <!-- Empty space for alignment -->
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <textarea id="description" class="form-textarea" placeholder="Enter a brief description of this charge..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Item</button>
        </div>
      </form>
    </div>
  </div>

  <!-- DELETE CONFIRM MODAL -->
  <div class="modal-backdrop" id="deleteModal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h3>Delete Billing Item</h3>
        <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="color: #64748b; font-size: 15px; line-height: 1.5;">
          Are you sure you want to delete <strong id="deleteItemName" style="color: #0f172a;"></strong>? This will remove it from the system permanently.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <script>
    // --- TOAST NOTIFICATION SYSTEM ---
    function showToast(message, type = 'success', duration = 4000) {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
      const titles = { success: 'Success', error: 'Error', warning: 'Warning', info: 'Info' };
      toast.innerHTML = `
        <div class="toast-icon">${icons[type] || icons.info}</div>
        <div class="toast-content">
          <div class="toast-title">${titles[type] || titles.info}</div>
          <div class="toast-message">${message}</div>
        </div>
        <button class="toast-close" onclick="this.parentElement.remove()">×</button>
      `;
      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, duration);
    }

    // Define functions in global scope immediately
    window.openAddModal = function() { 
      document.getElementById('billingForm').reset();
      document.getElementById('formBillingId').value = '';
      document.getElementById('modalTitle').innerText = 'Add Billing Item';
      document.getElementById('saveBtn').innerText = 'Save Item';
      document.getElementById('status').value = 'Active';
      document.getElementById('billingModal').classList.add('active'); 
    };

    window.closeModal = function() { 
      document.getElementById('billingModal').classList.remove('active');
    };

    window.openDeleteModal = function(id, item) {
      currentDeleteId = id;
      document.getElementById('deleteItemName').innerText = item;
      document.getElementById('deleteModal').classList.add('active');
    };

    window.closeDeleteModal = function() {
      document.getElementById('deleteModal').classList.remove('active');
      currentDeleteId = null;
    };

    let billingList = [];
    let currentDeleteId = null;

    document.addEventListener('DOMContentLoaded', function() {
      refreshData();
    });

    function refreshData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('billingTable').style.display = 'none';
      google.script.run.withSuccessHandler(renderTable).getBillingsData();
    }

    function renderTable(data) {
      billingList = data || [];
      const tbody = document.getElementById('tableBody');
      const loading = document.getElementById('loading');
      const table = document.getElementById('billingTable');
      const countBadge = document.getElementById('billingCount');

      loading.style.display = 'none';
      table.style.display = 'table';
      countBadge.innerText = billingList.length;

      tbody.innerHTML = '';
      if(billingList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; color:#64748b;">No billing items found.</td></tr>`;
        return;
      }

      billingList.forEach(row => {
        const tr = document.createElement('tr');
        tr.setAttribute('data-status', row.status || 'Active');
        tr.setAttribute('data-billing-id', row.billingId);

        const status = row.status || 'Active';
        let statusClass = status === 'Active' ? 'status-active' : 'status-inactive';

        tr.innerHTML = `
          <td><strong>${row.billingId}</strong></td>
          <td>${row.item}</td>
          <td>GHS ${row.amount.toFixed(2)}</td>
          <td><span class="status-badge ${statusClass}">${status}</span></td>
          <td>${row.description || '-'}</td>
          <td style="text-align: center;">
            <div class="actions-cell">
              <button class="action-icon-btn edit-btn" onclick="openEditModal('${row.billingId}')" title="Edit Item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              </button>
              <button class="action-icon-btn delete-btn" onclick="openDeleteModal('${row.billingId}', '${row.item}')" title="Delete Item">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
      filterTable();
      try { if (window._pendingOpen && window._pendingOpen.type === 'billing') { openBillingRecord(window._pendingOpen.billingId); window._pendingOpen = null; } } catch (e) { console.warn('openBillingRecord failed', e); }
    }

    function filterTable() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.querySelectorAll('#tableBody tr');
      const countBadge = document.getElementById('billingCount');
      let visibleCount = 0;

      rows.forEach(row => {
        if (row.cells.length === 1 && row.cells[0].getAttribute('colspan')) return;
        if(row.innerText.toLowerCase().includes(searchVal)) {
          row.style.display = ''; visibleCount++;
        } else {
          row.style.display = 'none';
        }
      });
      countBadge.innerText = visibleCount;
    }

    /* --- Additional window-scoped functions --- */
    window.openEditModal = function(billingId) {
      const item = billingList.find(i => i.billingId === billingId);
      if (!item) return showToast('Billing item not found', 'error');

      document.getElementById('formBillingId').value = item.billingId;
      document.getElementById('item').value = item.item;
      document.getElementById('amount').value = item.amount;
      document.getElementById('status').value = item.status;
      document.getElementById('description').value = item.description;

      document.getElementById('modalTitle').innerText = 'Edit Billing Item';
      document.getElementById('saveBtn').innerText = 'Update Item';
      document.getElementById('billingModal').classList.add('active');
    };

    // Allow parent to open/focus a billing item
    window.openBillingRecord = function(billingId) {
      if (!billingId) return;
      const item = billingList.find(b => b.billingId === billingId);
      if (item) {
        openEditModal(item.billingId);
        const tr = document.querySelector(`tr[data-billing-id="${billingId}"]`);
        if (tr) { tr.scrollIntoView({ behavior: 'smooth', block: 'center' }); tr.style.boxShadow = 'inset 0 0 0 3px rgba(59,130,246,0.08)'; setTimeout(() => tr.style.boxShadow = '', 3000); }
        return;
      }
      window._pendingOpen = { type: 'billing', billingId: billingId };
      refreshData();
    };

    function closeModal() { document.getElementById('billingModal').classList.remove('active'); }

    function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.innerText = 'Saving...';
      
      const billingId = document.getElementById('formBillingId').value;
      const data = {
        item: document.getElementById('item').value.trim(),
        amount: parseFloat(document.getElementById('amount').value) || 0,
        status: document.getElementById('status').value,
        description: document.getElementById('description').value.trim()
      };

      if (billingId) {
        // Update
        google.script.run
          .withSuccessHandler(function(res) {
            btn.disabled = false; btn.innerText = 'Update Item';
            if(res.success) { closeModal(); refreshData(); showToast('Billing item updated successfully', 'success'); }
          })
          .withFailureHandler(function(err) { btn.disabled = false; btn.innerText = 'Update Item'; showToast(err.message || 'Failed to update item', 'error'); })
          .updateBilling(billingId, data);
      } else {
        // Add
        google.script.run
          .withSuccessHandler(function(res) {
            btn.disabled = false; btn.innerText = 'Save Item';
            if(res.success) { closeModal(); refreshData(); showToast(`Billing item created! ID: ${res.billingId}`, 'success'); }
          })
          .withFailureHandler(function(err) { btn.disabled = false; btn.innerText = 'Save Item'; showToast(err.message || 'Failed to create item', 'error'); })
          .addBilling(data);
      }
    }

    /* --- DELETE LOGIC --- */
    function openDeleteModal(billingId, itemName) {
      currentDeleteId = billingId;
      document.getElementById('deleteItemName').innerText = itemName;
      document.getElementById('deleteModal').classList.add('active');
    }
    function closeDeleteModal() { document.getElementById('deleteModal').classList.remove('active'); currentDeleteId = null; }

    document.getElementById('confirmDeleteBtn').onclick = function() {
      if (!currentDeleteId) return;
      const btn = this; btn.disabled = true; btn.innerText = 'Deleting...';
      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false; btn.innerText = 'Delete';
          if(res.success) { closeDeleteModal(); refreshData(); showToast('Billing item deleted successfully', 'success'); }
        })
        .withFailureHandler(function(err) { btn.disabled = false; btn.innerText = 'Delete'; showToast(err.message || 'Failed to delete item', 'error'); })
        .deleteBilling(currentDeleteId);
    };
  </script>
</body>
</html>
