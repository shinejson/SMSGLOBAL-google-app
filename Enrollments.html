<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: #f4f7fc; padding: 40px; height: 100vh; overflow-x: hidden; }

    /* --- PAGE HEADER --- */
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .page-title { font-size: 22px; color: #0f172a; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .page-title span { color: #64748b; font-weight: 400; font-size: 16px; background: #e2e8f0; padding: 2px 10px; border-radius: 20px; }
    .action-btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .action-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); }

    /* --- TOOLBAR --- */
    .toolbar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 10px 10px 0 0; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; gap: 12px; margin: 0 -40px; }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .search-box { display: flex; align-items: center; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 8px; width: 250px; background: #f8fafc; }
    .search-box input { border: none; outline: none; background: transparent; width: 100%; margin-left: 8px; font-size: 14px; color: #333; }
    .form-input, .form-select { padding: 8px 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; color: #0f172a; background: #fff; outline: none; transition: border-color 0.2s; }
    .form-input:focus, .form-select:focus { border-color: #3b82f6; }

    /* --- TABLE --- */
    .table-container { background: white; border-radius: 0 0 10px 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow-x: auto; margin: 0 -40px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
    th { text-align: left; padding: 16px 20px; color: #475569; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
    td { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
    tr:hover { background-color: #f8fafc; }

    /* --- BADGES --- */
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
    .status-active { background: #dcfce7; color: #166534; }
    .status-inactive { background: #fee2e2; color: #991b1b; }
    .status-completed { background: #e0f2fe; color: #0369a1; }

    /* --- LOADING --- */
    #loading { text-align: center; padding: 40px; color: #64748b; }

    /* --- MODALS --- */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: white; width: 90%; max-width: 500px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); transform: scale(0.95); transition: transform 0.25s ease; overflow: hidden; display: flex; flex-direction: column; }
    .modal-backdrop.active .modal-content { transform: scale(1); }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 18px; color: #0f172a; font-weight: 600; }
    .modal-close { color: #94a3b8; font-size: 24px; background: none; border: none; cursor: pointer; transition: color 0.15s; }
    .modal-close:hover { color: #334155; }
    .modal-body { padding: 24px; max-height: 70vh; overflow-y: auto; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid #f1f5f9; background: #f8fafc; display: flex; justify-content: flex-end; gap: 12px; }
    
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #475569; margin-bottom: 6px; letter-spacing: 0.5px; }
    .form-input, .form-select { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; color: #0f172a; background: #fff; transition: border-color 0.15s, box-shadow 0.15s; }
    .form-input:focus, .form-select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    
    .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; color: #1e293b; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }

    /* --- RESPONSIVE --- */
    @media (max-width: 768px) {
      body { padding: 20px; }
      .table-container { margin: 0 -20px; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .toolbar { flex-direction: column; align-items: flex-start; }
      .toolbar-left, .toolbar-right { width: 100%; flex-direction: column; }
      .search-box { width: 100%; }
    }

    /* --- DARK MODE STYLES --- */
    body.dark-mode {
      background-color: #0f172a;
      color: #f1f5f9;
    }
    body.dark-mode .page-title {
      color: #f1f5f9;
    }
    body.dark-mode .page-title span {
      background: #1e293b;
      color: #94a3b8;
    }
    body.dark-mode .toolbar {
      background: #1e293b;
      border-bottom-color: #334155;
    }
    body.dark-mode .search-box {
      background: #0f172a;
      border-color: #334155;
    }
    body.dark-mode .search-box input {
      color: #f1f5f9;
    }
    body.dark-mode .form-input,
    body.dark-mode .form-select {
      background: #1e293b;
      border-color: #334155;
      color: #f1f5f9;
    }
    body.dark-mode .form-input:focus,
    body.dark-mode .form-select:focus {
      border-color: #3b82f6;
    }
    body.dark-mode .table-container {
      background: #1e293b;
    }
    body.dark-mode thead {
      background: #0f172a;
      border-bottom-color: #334155;
    }
    body.dark-mode th {
      color: #94a3b8;
    }
    body.dark-mode td {
      color: #f1f5f9;
      border-bottom-color: #334155;
    }
    body.dark-mode tr:hover {
      background-color: #334155;
    }
    body.dark-mode #loading {
      color: #94a3b8;
    }
    body.dark-mode .modal-content {
      background: #1e293b;
    }
    body.dark-mode .modal-header {
      border-bottom-color: #334155;
    }
    body.dark-mode .modal-header h3 {
      color: #f1f5f9;
    }
    body.dark-mode .modal-close {
      color: #94a3b8;
    }
    body.dark-mode .modal-close:hover {
      color: #f1f5f9;
    }
    body.dark-mode .modal-footer {
      background: #0f172a;
      border-top-color: #334155;
    }
    body.dark-mode .form-label {
      color: #94a3b8;
    }
    body.dark-mode .btn-secondary {
      background: #334155;
      color: #f1f5f9;
    }
    body.dark-mode .btn-secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="page-header">
    <div class="page-title">
      ✍️ Enrollments
      <span id="enrollmentCount">0</span>
    </div>
    <button class="action-btn" onclick="openAddModal()">+ Enroll Student</button>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Search ID, Student, or Course..." onkeyup="filterTable()">
      </div>
    </div>
    <div class="toolbar-right">
      <select id="statusFilter" class="form-select" onchange="filterTable()">
        <option value="">All Statuses</option>
        <option value="Active">Active</option>
        <option value="Completed">Completed</option>
        <option value="Inactive">Inactive</option>
      </select>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-container">
    <div id="loading">Loading enrollment data...</div>
    <table id="enrollmentTable" style="display:none;">
      <thead>
        <tr>
          <th>Enrollment ID</th>
          <th>Student ID</th>
          <th>Course ID</th>
          <th>Enrollment Date</th>
          <th>Grade</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- ADD ENROLLMENT MODAL -->
  <div class="modal-backdrop" id="enrollmentModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Enroll Student</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="enrollmentForm" onsubmit="handleSubmit(event)">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="studentSelect">Select Student</label>
            <select id="studentSelect" class="form-select" required>
              <option value="" disabled selected>Select a Student</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="courseSelect">Select Course</label>
            <select id="courseSelect" class="form-select" required>
              <option value="" disabled selected>Select a Course</option>
            </select>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="enrollmentDate">Enrollment Date</label>
              <input type="date" id="enrollmentDate" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="grade">Grade</label>
              <select id="grade" class="form-select">
                <option value="">Not Graded</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
                <option value="F">F</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="status">Status</label>
            <select id="status" class="form-select" required>
              <option value="Active">Active</option>
              <option value="Completed">Completed</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Enrollment</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let enrollmentList = [];

    document.addEventListener('DOMContentLoaded', function() {
      // Set default date to today
      document.getElementById('enrollmentDate').value = new Date().toISOString().split('T')[0];
      
      // Load supporting data for dropdowns, then the main data
      populateDropdowns();
      refreshData();
    });

    function refreshData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('enrollmentTable').style.display = 'none';
      google.script.run.withSuccessHandler(renderTable).getEnrollmentsData();
    }

    function populateDropdowns() {
      // Load Students
      google.script.run.withSuccessHandler(function(students) {
        const select = document.getElementById('studentSelect');
        students.forEach(s => {
          let opt = document.createElement('option');
          opt.value = s.studentId;
          opt.innerText = `${s.studentId} - ${s.fullName}`;
          select.appendChild(opt);
        });
      }).getStudentIdNamePairs();

      // Load Courses
      google.script.run.withSuccessHandler(function(courses) {
        const select = document.getElementById('courseSelect');
        courses.forEach(c => {
          let opt = document.createElement('option');
          opt.value = c.courseId;
          opt.innerText = `${c.courseId} - ${c.courseName}`;
          select.appendChild(opt);
        });
      }).getCourseIdNamePairs();
    }

    function renderTable(data) {
      enrollmentList = data || [];
      const tbody = document.getElementById('tableBody');
      const loading = document.getElementById('loading');
      const table = document.getElementById('enrollmentTable');
      const countBadge = document.getElementById('enrollmentCount');

      loading.style.display = 'none';
      table.style.display = 'table';
      countBadge.innerText = enrollmentList.length;

      tbody.innerHTML = '';
      
      if(enrollmentList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; color:#64748b;">No enrollments found.</td></tr>`;
        return;
      }

      enrollmentList.forEach(row => {
        const tr = document.createElement('tr');
        tr.setAttribute('data-status', row.status || '');

        let statusClass = 'status-active';
        if(row.status === 'Inactive') statusClass = 'status-inactive';
        if(row.status === 'Completed') statusClass = 'status-completed';

        tr.innerHTML = `
          <td><strong>${row.enrollmentId || '-'}</strong></td>
          <td>${row.studentId || '-'}</td>
          <td>${row.courseId || '-'}</td>
          <td>${row.enrollmentDate || '-'}</td>
          <td>${row.grade || '-'}</td>
          <td><span class="status-badge ${statusClass}">${row.status || 'Active'}</span></td>
        `;
        tbody.appendChild(tr);
      });
      
      filterTable();
    }

    function filterTable() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const statusVal = document.getElementById('statusFilter').value.toLowerCase();
      const rows = document.querySelectorAll('#tableBody tr');
      const countBadge = document.getElementById('enrollmentCount');

      let visibleCount = 0;
      rows.forEach(row => {
        if (row.cells.length === 1 && row.cells[0].getAttribute('colspan')) return;

        const text = row.innerText.toLowerCase();
        const rowStatus = (row.getAttribute('data-status') || '').toLowerCase();

        const matchSearch = text.includes(searchVal);
        const matchStatus = statusVal === '' || rowStatus === statusVal;

        if (matchSearch && matchStatus) {
          row.style.display = ''; visibleCount++;
        } else {
          row.style.display = 'none';
        }
      });
      countBadge.innerText = visibleCount;
    }

    function openAddModal() { 
      document.getElementById('enrollmentForm').reset();
      document.getElementById('enrollmentDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('enrollmentModal').classList.add('active'); 
    }

    function closeModal() { document.getElementById('enrollmentModal').classList.remove('active'); }

    function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.innerText = 'Saving...';

      const data = {
        studentId: document.getElementById('studentSelect').value,
        courseId: document.getElementById('courseSelect').value,
        enrollmentDate: document.getElementById('enrollmentDate').value,
        grade: document.getElementById('grade').value,
        status: document.getElementById('status').value
      };

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false; btn.innerText = 'Save Enrollment';
          if(res.success) {
            closeModal();
            refreshData();
            alert(`Enrollment saved successfully! ID: ${res.enrollmentId}`);
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false; btn.innerText = 'Save Enrollment';
          alert('Error: ' + err.message);
        })
        .addEnrollment(data);
    }
  </script>
</body>
</html>
