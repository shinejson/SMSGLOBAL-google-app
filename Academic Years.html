<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: #f4f7fc; padding: 40px; height: 100vh; overflow-x: hidden; }

    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .page-title { font-size: 22px; color: #0f172a; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .page-title span { color: #64748b; font-weight: 400; font-size: 16px; background: #e2e8f0; padding: 2px 10px; border-radius: 20px; }
    .action-btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .action-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); }

    .toolbar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 10px 10px 0 0; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; gap: 12px; margin: 0 -40px; }
    .search-box { display: flex; align-items: center; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 8px; width: 300px; background: #f8fafc; }
    .search-box input { border: none; outline: none; background: transparent; width: 100%; margin-left: 8px; font-size: 14px; color: #333; }

    .list-container { background: white; border-radius: 0 0 10px 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow: hidden; margin: 0 -40px; }
    .list-item { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
    .list-item:last-child { border-bottom: none; }
    .list-item:hover { background-color: #f8fafc; }
    .list-item-left { display: flex; align-items: center; gap: 20px; flex: 1; }
    .list-item-right { display: flex; align-items: center; gap: 12px; }
    .list-item h4 { font-size: 15px; font-weight: 500; color: #0f172a; }

    /* BADGE */
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
    .status-active { background: #dcfce7; color: #166534; }
    .status-inactive { background: #fee2e2; color: #991b1b; }

    /* ACTION BUTTONS */
    .action-icon-btn { background: none; border: none; cursor: pointer; padding: 6px 10px; border-radius: 6px; font-size: 18px; transition: all 0.2s; }
    .action-icon-btn:hover { transform: scale(1.1); }
    .edit-btn { color: #3b82f6; }
    .edit-btn:hover { background: #eff6ff; }
    .delete-btn { color: #ef4444; }
    .delete-btn:hover { background: #fef2f2; }

    #loading { text-align: center; padding: 40px; color: #64748b; }

    /* MODAL */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: white; width: 90%; max-width: 450px; border-radius: 12px; transform: scale(0.95); transition: transform 0.25s ease; overflow: hidden; }
    .modal-backdrop.active .modal-content { transform: scale(1); }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 18px; color: #0f172a; font-weight: 600; }
    .modal-close { color: #94a3b8; font-size: 24px; background: none; border: none; cursor: pointer; }
    .modal-body { padding: 24px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid #f1f5f9; background: #f8fafc; display: flex; justify-content: flex-end; gap: 12px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #475569; margin-bottom: 6px; }
    .form-input, .form-select { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; color: #0f172a; background: #fff; }
    .form-input:focus, .form-select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; color: #1e293b; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }

    /* TOAST NOTIFICATIONS */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      background: white;
      border-radius: 8px;
      padding: 14px 18px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 300px;
      max-width: 400px;
      opacity: 0;
      transform: translateX(400px);
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      pointer-events: auto;
      border-left: 4px solid;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(0);
    }
    .toast.success { border-left-color: #10b981; }
    .toast.error { border-left-color: #ef4444; }
    .toast.warning { border-left-color: #f59e0b; }
    .toast.info { border-left-color: #3b82f6; }
    
    .toast-icon {
      font-size: 20px;
      flex-shrink: 0;
    }
    .toast.success .toast-icon { color: #10b981; }
    .toast.error .toast-icon { color: #ef4444; }
    .toast.warning .toast-icon { color: #f59e0b; }
    .toast.info .toast-icon { color: #3b82f6; }
    
    .toast-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .toast-title {
      font-weight: 600;
      font-size: 14px;
      color: #0f172a;
    }
    .toast-message {
      font-size: 13px;
      color: #64748b;
      line-height: 1.4;
    }
    .toast-close {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 18px;
      padding: 0;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .toast-close:hover { color: #475569; }

    @media (max-width: 768px) {
      body { padding: 20px; }
      .list-container { margin: 0 -20px; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .search-box { width: 100%; }
    }

    /* --- DARK MODE --- */
    body.dark-mode { background-color: #0f172a; color: #f1f5f9; }
    body.dark-mode .page-title { color: #f1f5f9; }
    body.dark-mode .page-title span { background: #334155; color: #94a3b8; }
    body.dark-mode .toolbar { background: #1e293b; border-bottom-color: #334155; }
    body.dark-mode .search-box { background: #0f172a; border-color: #334155; }
    body.dark-mode .search-box input { color: #f1f5f9; }
    body.dark-mode .search-box input::placeholder { color: #64748b; }
    body.dark-mode .list-container { background: #1e293b; }
    body.dark-mode .list-item { border-bottom-color: #334155; }
    body.dark-mode .list-item:hover { background-color: #334155; }
    body.dark-mode .list-item h4 { color: #f1f5f9; }
    body.dark-mode #loading { color: #94a3b8; }
    body.dark-mode .modal-content { background: #1e293b; }
    body.dark-mode .modal-header { border-bottom-color: #334155; }
    body.dark-mode .modal-header h3 { color: #f1f5f9; }
    body.dark-mode .modal-close { color: #94a3b8; }
    body.dark-mode .modal-close:hover { color: #f1f5f9; }
    body.dark-mode .modal-footer { background: #0f172a; border-top-color: #334155; }
    body.dark-mode .form-label { color: #94a3b8; }
    body.dark-mode .form-input, body.dark-mode .form-select { background: #0f172a; border-color: #334155; color: #f1f5f9; }
    body.dark-mode .form-input:focus, body.dark-mode .form-select:focus { border-color: #3b82f6; }
    body.dark-mode .btn-secondary { background: #334155; color: #f1f5f9; }
    body.dark-mode .btn-secondary:hover { background: #475569; }
    body.dark-mode .toast { background: #1e293b; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5); }
    body.dark-mode .toast-title { color: #f1f5f9; }
    body.dark-mode .toast-message { color: #cbd5e1; }
  </style>
</head>
<body>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <div class="page-header">
    <div class="page-title">
      📅 Academic Years
      <span id="yearCount">0</span>
    </div>
    <button class="action-btn" onclick="openAddModal()">+ Add Year</button>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Search years..." onkeyup="filterList()">
    </div>
  </div>

  <div class="list-container">
    <div id="loading">Loading academic years...</div>
    <div id="yearsList"></div>
  </div>

  <!-- ADD/EDIT MODAL -->
  <div class="modal-backdrop" id="academicYearModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Academic Year</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="yearForm" onsubmit="handleSubmit(event)">
        <input type="hidden" id="originalYear">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="academicYear">Academic Year</label>
            <input type="text" id="academicYear" class="form-input" placeholder="e.g. 2026-2027" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="status">Status</label>
            <select id="status" class="form-select">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Year</button>
        </div>
      </form>
    </div>
  </div>

  <!-- DELETE CONFIRMATION MODAL -->
  <div class="modal-backdrop" id="deleteModal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h3>Delete Academic Year</h3>
        <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="color: #64748b; font-size: 15px; line-height: 1.5;">
          Are you sure you want to delete <strong id="deleteYearName" style="color: #0f172a;"></strong>?
        </p>
        <p style="color: #ef4444; font-size: 13px; margin-top: 10px;">
          This action cannot be undone.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <script>
    let yearList = [];
    let currentDeleteYear = null;
    let isEditMode = false;

    document.addEventListener('DOMContentLoaded', function() { refreshData(); });

    // TOAST NOTIFICATION SYSTEM
    function showToast(message, type = 'success', duration = 4000) {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      const icons = {
        success: '✓',
        error: '✕',
        warning: '⚠',
        info: 'ℹ'
      };
      
      const titles = {
        success: 'Success',
        error: 'Error',
        warning: 'Warning',
        info: 'Info'
      };
      
      toast.innerHTML = `
        <div class="toast-icon">${icons[type] || icons.info}</div>
        <div class="toast-content">
          <div class="toast-title">${titles[type] || titles.info}</div>
          <div class="toast-message">${message}</div>
        </div>
        <button class="toast-close" onclick="this.parentElement.remove()">×</button>
      `;
      
      container.appendChild(toast);
      
      // Trigger animation
      setTimeout(() => toast.classList.add('show'), 10);
      
      // Auto remove
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }

    function refreshData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('yearsList').style.display = 'none';
      google.script.run.withSuccessHandler(renderList).getAcademicYearsData();
    }

    function renderList(data) {
      yearList = data || [];
      const container = document.getElementById('yearsList');
      const loading = document.getElementById('loading');
      const countBadge = document.getElementById('yearCount');

      loading.style.display = 'none';
      container.style.display = 'block';
      countBadge.innerText = yearList.length;

      container.innerHTML = '';
      if(yearList.length === 0) {
        container.innerHTML = `<div style="padding: 30px; text-align: center; color: #64748b;">No academic years found.</div>`;
        return;
      }

      yearList.forEach(item => {
        const div = document.createElement('div');
        div.className = 'list-item';
        let badgeClass = item.status === 'Active' ? 'status-active' : 'status-inactive';
        div.innerHTML = `
          <div class="list-item-left">
            <h4>${item.academicYear}</h4>
          </div>
          <div class="list-item-right">
            <span class="status-badge ${badgeClass}">${item.status || 'Active'}</span>
            <button class="action-icon-btn edit-btn" onclick='editYear(${JSON.stringify(item)})' title="Edit">
              ✏️
            </button>
            <button class="action-icon-btn delete-btn" onclick='openDeleteModal("${item.academicYear}")' title="Delete">
              🗑️
            </button>
          </div>
        `;
        container.appendChild(div);
      });
      filterList();
    }

    function filterList() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const items = document.querySelectorAll('.list-item');
      const countBadge = document.getElementById('yearCount');
      let visibleCount = 0;

      items.forEach(item => {
        if(item.innerText.toLowerCase().includes(searchVal)) {
          item.style.display = 'flex'; visibleCount++;
        } else {
          item.style.display = 'none';
        }
      });
      countBadge.innerText = visibleCount;
    }

    // ADD MODAL
    function openAddModal() {
      isEditMode = false;
      document.getElementById('modalTitle').innerText = 'Add New Academic Year';
      document.getElementById('saveBtn').innerText = 'Save Year';
      document.getElementById('yearForm').reset();
      document.getElementById('originalYear').value = '';
      document.getElementById('academicYearModal').classList.add('active');
    }

    // EDIT MODAL
    function editYear(item) {
      isEditMode = true;
      document.getElementById('modalTitle').innerText = 'Edit Academic Year';
      document.getElementById('saveBtn').innerText = 'Update Year';
      document.getElementById('originalYear').value = item.academicYear;
      document.getElementById('academicYear').value = item.academicYear;
      document.getElementById('status').value = item.status || 'Active';
      document.getElementById('academicYearModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('academicYearModal').classList.remove('active');
    }

    // SAVE (CREATE OR UPDATE)
    function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerText = isEditMode ? 'Updating...' : 'Saving...';
      
      const data = {
        academicYear: document.getElementById('academicYear').value.trim(),
        status: document.getElementById('status').value
      };

      if (isEditMode) {
        const originalYear = document.getElementById('originalYear').value;
        google.script.run
          .withSuccessHandler(function(res) {
            btn.disabled = false;
            btn.innerText = 'Update Year';
            if(res.success) {
              closeModal();
              refreshData();
              showToast('Academic Year updated successfully!', 'success');
            } else {
              showToast(res.message || 'Failed to update academic year', 'error');
            }
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerText = 'Update Year';
            showToast('Error: ' + err.message, 'error');
          })
          .updateAcademicYear(originalYear, data);
      } else {
        google.script.run
          .withSuccessHandler(function(res) {
            btn.disabled = false;
            btn.innerText = 'Save Year';
            if(res.success) {
              closeModal();
              document.getElementById('yearForm').reset();
              refreshData();
              showToast('Academic Year added successfully!', 'success');
            } else {
              showToast(res.message || 'Failed to add academic year', 'error');
            }
          })
          .withFailureHandler(function(err) {
            btn.disabled = false;
            btn.innerText = 'Save Year';
            showToast('Error: ' + err.message, 'error');
          })
          .addAcademicYear(data);
      }
    }

    // DELETE MODAL
    function openDeleteModal(yearName) {
      currentDeleteYear = yearName;
      document.getElementById('deleteYearName').innerText = yearName;
      document.getElementById('deleteModal').classList.add('active');
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.remove('active');
      currentDeleteYear = null;
    }

    // DELETE CONFIRMATION
    document.getElementById('confirmDeleteBtn').onclick = function() {
      if (!currentDeleteYear) return;
      
      const btn = this;
      btn.disabled = true;
      btn.innerText = 'Deleting...';

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.innerText = 'Delete';
          if(res.success) {
            closeDeleteModal();
            refreshData();
            showToast('Academic Year deleted successfully!', 'success');
          } else {
            showToast(res.message || 'Failed to delete academic year', 'error');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerText = 'Delete';
          showToast('Error: ' + err.message, 'error');
        })
        .deleteAcademicYear(currentDeleteYear);
    };
  </script>
</body>
</html>
