<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: #f4f7fc; padding: 40px; height: 100vh; overflow-x: hidden; }

    /* --- HEADER --- */
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .page-title { font-size: 22px; color: #0f172a; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .page-title span { color: #64748b; font-weight: 400; font-size: 16px; background: #e2e8f0; padding: 2px 10px; border-radius: 20px; }
    .action-btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .action-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); }

    /* --- TOOLBAR --- */
    .toolbar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 10px 10px 0 0; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; gap: 12px; margin: 0 -40px; }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .search-box { display: flex; align-items: center; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 8px; width: 300px; background: #f8fafc; }
    .search-box input { border: none; outline: none; background: transparent; width: 100%; margin-left: 8px; font-size: 14px; color: #333; }
    .form-select { padding: 8px 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; color: #0f172a; background: #fff; outline: none; }

    /* --- TABLE --- */
    .table-container { background: white; border-radius: 0 0 10px 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow-x: auto; margin: 0 -40px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
    th { text-align: left; padding: 16px 20px; color: #475569; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; white-space: nowrap; }
    td { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
    tr:hover { background-color: #f8fafc; }

    /* ACTION BUTTONS */
    .action-icon-btn { background: none; border: none; cursor: pointer; padding: 6px 10px; border-radius: 6px; font-size: 18px; transition: all 0.2s; }
    .action-icon-btn:hover { transform: scale(1.1); }
    .edit-btn { color: #3b82f6; }
    .edit-btn:hover { background: #eff6ff; }
    .delete-btn { color: #ef4444; }
    .delete-btn:hover { background: #fef2f2; }

    #loading { text-align: center; padding: 40px; color: #64748b; }

    /* --- MODALS --- */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: white; width: 90%; max-width: 500px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); transform: scale(0.95); transition: transform 0.25s ease; overflow: hidden; display: flex; flex-direction: column; }
    .modal-backdrop.active .modal-content { transform: scale(1); }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 18px; color: #0f172a; font-weight: 600; }
    .modal-close { color: #94a3b8; font-size: 24px; background: none; border: none; cursor: pointer; }
    .modal-body { padding: 24px; max-height: 70vh; overflow-y: auto; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid #f1f5f9; background: #f8fafc; display: flex; justify-content: flex-end; gap: 12px; }
    
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #475569; margin-bottom: 6px; }
    .form-input, .form-select { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; color: #0f172a; background: #fff; transition: border-color 0.15s; }
    .form-input:focus, .form-select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    
    .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; color: #1e293b; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }

    /* --- TOAST NOTIFICATIONS --- */
    .toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      min-width: 320px;
      max-width: 440px;
      background: white;
      color: #0f172a;
      padding: 14px 18px;
      border-radius: 10px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      gap: 12px;
      border-left: 5px solid #10b981;
      transform: translateX(120%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      opacity: 0;
    }
    .toast.active {
      transform: translateX(0);
      opacity: 1;
    }
    .toast-error {
      border-left-color: #ef4444;
    }
    .toast-warning {
      border-left-color: #f59e0b;
    }
    .toast-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #dcfce7;
      color: #166534;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      flex-shrink: 0;
    }
    .toast-error .toast-icon {
      background: #fee2e2;
      color: #991b1b;
    }
    .toast-warning .toast-icon {
      background: #fef3c7;
      color: #92400e;
    }
    .toast-message {
      font-size: 14px;
      font-weight: 500;
      color: #1e293b;
      flex: 1;
      line-height: 1.4;
    }
    .toast-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    .toast-close:hover {
      color: #334155;
    }

    @media (max-width: 768px) {
      body { padding: 20px; }
      .table-container { margin: 0 -20px; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .toolbar { flex-direction: column; align-items: flex-start; }
      .toolbar-left, .toolbar-right { width: 100%; flex-direction: column; }
      .search-box { width: 100%; }
      .form-grid { grid-template-columns: 1fr; }
      .toast-container { top: 16px; right: 16px; left: 16px; }
      .toast { min-width: auto; max-width: 100%; }
    }

    /* --- DARK MODE --- */
    body.dark-mode { background-color: #0f172a; color: #f1f5f9; }
    body.dark-mode .page-title { color: #f1f5f9; }
    body.dark-mode .page-title span { background: #334155; color: #94a3b8; }
    body.dark-mode .toolbar { background: #1e293b; border-bottom-color: #334155; }
    body.dark-mode .search-box { background: #0f172a; border-color: #334155; }
    body.dark-mode .search-box input { color: #f1f5f9; }
    body.dark-mode .table-container { background: #1e293b; }
    body.dark-mode thead { background: #0f172a; border-bottom-color: #334155; }
    body.dark-mode th { color: #94a3b8; }
    body.dark-mode td { border-bottom-color: #334155; color: #f1f5f9; }
    body.dark-mode tr:hover { background-color: #334155; }
    body.dark-mode #loading { color: #94a3b8; }
    body.dark-mode .form-select, body.dark-mode .form-input { background: #0f172a; border-color: #334155; color: #f1f5f9; }
    body.dark-mode .modal-content { background: #1e293b; }
    body.dark-mode .modal-header { border-bottom-color: #334155; }
    body.dark-mode .modal-header h3 { color: #f1f5f9; }
    body.dark-mode .modal-close { color: #94a3b8; }
    body.dark-mode .modal-close:hover { color: #f1f5f9; }
    body.dark-mode .modal-footer { background: #0f172a; border-top-color: #334155; }
    body.dark-mode .form-label { color: #94a3b8; }
    body.dark-mode .btn-secondary { background: #334155; color: #f1f5f9; }
    body.dark-mode .btn-secondary:hover { background: #475569; }
    body.dark-mode .toast { background: #1e293b; color: #f1f5f9; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    body.dark-mode .toast-message { color: #f1f5f9; }
  </style>
</head>
<body>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- HEADER -->
  <div class="page-header">
    <div class="page-title">
      👨‍🏫 Teachers
      <span id="teacherCount">0</span>
    </div>
    <button class="action-btn" onclick="openAddModal()">+ Add Teacher</button>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Search name, ID, or class..." onkeyup="filterTable()">
      </div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-container">
    <div id="loading">Loading teachers...</div>
    <table id="teacherTable" style="display:none;">
      <thead>
        <tr>
          <th>Teacher ID</th>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Class</th>
          <th>Academic Year</th>
          <th style="text-align: center;">Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- ADD/EDIT MODAL -->
  <div class="modal-backdrop" id="teacherModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Teacher</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="teacherForm" onsubmit="handleSubmit(event)">
        <input type="hidden" id="originalTeacherId">
        <div class="modal-body">
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="firstName">First Name</label>
              <input type="text" id="firstName" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="lastName">Last Name</label>
              <input type="text" id="lastName" class="form-input" required>
            </div>
          </div>
          
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label" for="classSelect">Assigned Class</label>
              <select id="classSelect" class="form-select" required>
                <option value="" disabled selected>Select Class</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="yearSelect">Academic Year</label>
              <select id="yearSelect" class="form-select" required>
                <option value="" disabled selected>Select Year</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Teacher</button>
        </div>
      </form>
    </div>
  </div>

  <!-- DELETE CONFIRMATION MODAL -->
  <div class="modal-backdrop" id="deleteModal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h3>Delete Teacher</h3>
        <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="color: #64748b; font-size: 15px; line-height: 1.5;">
          Are you sure you want to delete teacher <strong id="deleteTeacherName" style="color: #0f172a;"></strong>?
        </p>
        <p style="color: #ef4444; font-size: 13px; margin-top: 10px;">
          This action cannot be undone.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <script>
    let teacherList = [];
    let currentDeleteTeacher = null;
    let isEditMode = false;

    document.addEventListener('DOMContentLoaded', function() {
      loadDropdowns();
      refreshData();
    });

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type === 'error' ? 'toast-error' : type === 'warning' ? 'toast-warning' : ''}`;
      
      const icon = type === 'error' ? '✕' : type === 'warning' ? '⚠' : '✓';
      
      toast.innerHTML = `
        <div class="toast-icon">${icon}</div>
        <div class="toast-message">${message}</div>
        <button class="toast-close" onclick="this.parentElement.remove()">&times;</button>
      `;
      
      container.appendChild(toast);
      
      // Trigger animation
      setTimeout(() => toast.classList.add('active'), 10);
      
      // Auto remove after 3.5 seconds
      setTimeout(() => {
        toast.classList.remove('active');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function refreshData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('teacherTable').style.display = 'none';
      google.script.run.withSuccessHandler(renderTable).getTeachersData();
    }

    function loadDropdowns() {
      // Load Classes
      google.script.run.withSuccessHandler(function(classes) {
        const select = document.getElementById('classSelect');
        select.innerHTML = '<option value="" disabled selected>Select Class</option>';
        classes.forEach(c => {
          let opt = document.createElement('option');
          opt.value = c; opt.innerText = c;
          select.appendChild(opt);
        });
      }).getClassNames();

      // Load Academic Years
      google.script.run.withSuccessHandler(function(years) {
        const select = document.getElementById('yearSelect');
        select.innerHTML = '<option value="" disabled selected>Select Year</option>';
        years.forEach(y => {
          let opt = document.createElement('option');
          opt.value = y.academicYear; opt.innerText = y.academicYear;
          select.appendChild(opt);
        });
      }).getAcademicYearsData();
    }

    function renderTable(data) {
      teacherList = data || [];
      const tbody = document.getElementById('tableBody');
      const loading = document.getElementById('loading');
      const table = document.getElementById('teacherTable');
      const countBadge = document.getElementById('teacherCount');

      loading.style.display = 'none';
      table.style.display = 'table';
      countBadge.innerText = teacherList.length;

      tbody.innerHTML = '';
      if(teacherList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:30px; color:#64748b;">No teachers found.</td></tr>`;
        return;
      }

      teacherList.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${row.teacherId || '-'}</strong></td>
          <td>${row.firstName || '-'}</td>
          <td>${row.lastName || '-'}</td>
          <td>${row.class || '-'}</td>
          <td>${row.academicYear || '-'}</td>
          <td style="text-align: center;">
            <button class="action-icon-btn edit-btn" onclick='editTeacher(${JSON.stringify(row)})' title="Edit">
              ✏️
            </button>
            <button class="action-icon-btn delete-btn" onclick='openDeleteModal("${row.teacherId}", "${row.firstName} ${row.lastName}")' title="Delete">
              🗑️
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
      filterTable();
    }

    function filterTable() {
      const searchVal = document.getElementById('searchInput').value.toLowerCase();
      const rows = document.querySelectorAll('#tableBody tr');
      const countBadge = document.getElementById('teacherCount');
      let visibleCount = 0;

      rows.forEach(row => {
        if (row.cells.length === 1 && row.cells[0].getAttribute('colspan')) return;
        if(row.innerText.toLowerCase().includes(searchVal)) {
          row.style.display = ''; visibleCount++;
        } else {
          row.style.display = 'none';
        }
      });
      countBadge.innerText = visibleCount;
    }

    // ADD MODAL
    function openAddModal() {
      isEditMode = false;
      document.getElementById('modalTitle').innerText = 'Add New Teacher';
      document.getElementById('saveBtn').innerText = 'Save Teacher';
      document.getElementById('teacherForm').reset();
      document.getElementById('originalTeacherId').value = '';
      document.getElementById('teacherModal').classList.add('active');
    }

    // EDIT MODAL
    function editTeacher(teacher) {
      isEditMode = true;
      document.getElementById('modalTitle').innerText = 'Edit Teacher';
      document.getElementById('saveBtn').innerText = 'Update Teacher';
      document.getElementById('originalTeacherId').value = teacher.teacherId;
      document.getElementById('firstName').value = teacher.firstName;
      document.getElementById('lastName').value = teacher.lastName;
      document.getElementById('classSelect').value = teacher.class;
      document.getElementById('yearSelect').value = teacher.academicYear;
      document.getElementById('teacherModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('teacherModal').classList.remove('active');
    }

    // SAVE (CREATE OR UPDATE)
    function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerText = isEditMode ? 'Updating...' : 'Saving...';
      
      const data = {
        firstName: document.getElementById('firstName').value.trim(),
        lastName: document.getElementById('lastName').value.trim(),
        class: document.getElementById('classSelect').value,
        academicYear: document.getElementById('yearSelect').value
      };

      function submitTeacher(payload) {
        if (isEditMode) {
          const originalTeacherId = document.getElementById('originalTeacherId').value;
          google.script.run
            .withSuccessHandler(function(res) {
              if (res && res.requiresAdminOverride && !payload.__adminAcademicYearOverride) {
                const proceed = confirm((res.message || 'This action needs admin confirmation.') + '\n\nClick OK to continue as Admin, or Cancel to stop.');
                if (!proceed) {
                  btn.disabled = false; btn.innerText = 'Update Teacher';
                  showToast('Teacher update cancelled.', 'warning');
                  return;
                }
                payload.__adminAcademicYearOverride = true;
                submitTeacher(payload);
                return;
              }
              btn.disabled = false;
              btn.innerText = 'Update Teacher';
              if(res.success) {
                closeModal();
                refreshData();
                showToast('Teacher updated successfully!', 'success');
              } else {
                showToast(res && res.message ? res.message : 'Error updating teacher.', 'error');
              }
            })
            .withFailureHandler(function(err) {
              btn.disabled = false; btn.innerText = 'Update Teacher';
              showToast('Error: ' + (err ? err.message : 'Could not update teacher.'), 'error');
            })
            .updateTeacher(originalTeacherId, payload);
        } else {
          google.script.run
            .withSuccessHandler(function(res) {
              if (res && res.requiresAdminOverride && !payload.__adminAcademicYearOverride) {
                const proceed = confirm((res.message || 'This action needs admin confirmation.') + '\n\nClick OK to continue as Admin, or Cancel to stop.');
                if (!proceed) {
                  btn.disabled = false; btn.innerText = 'Save Teacher';
                  showToast('Teacher save cancelled.', 'warning');
                  return;
                }
                payload.__adminAcademicYearOverride = true;
                submitTeacher(payload);
                return;
              }
              btn.disabled = false; btn.innerText = 'Save Teacher';
              if(res.success) {
                closeModal(); 
                document.getElementById('teacherForm').reset();
                refreshData();
                showToast(`Teacher added successfully! ID: ${res.teacherId}`, 'success');
              } else {
                showToast(res && res.message ? res.message : 'Error saving teacher record.', 'error');
              }
            })
            .withFailureHandler(function(err) {
              btn.disabled = false; btn.innerText = 'Save Teacher';
              showToast('Error: ' + (err ? err.message : 'Could not save teacher.'), 'error');
            })
            .addTeacher(payload);
        }
      }

      submitTeacher(data);
    }

    // DELETE MODAL
    function openDeleteModal(teacherId, teacherName) {
      currentDeleteTeacher = teacherId;
      document.getElementById('deleteTeacherName').innerText = teacherName;
      document.getElementById('deleteModal').classList.add('active');
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.remove('active');
      currentDeleteTeacher = null;
    }

    // DELETE CONFIRMATION
    document.getElementById('confirmDeleteBtn').onclick = function() {
      if (!currentDeleteTeacher) return;
      
      const btn = this;
      btn.disabled = true;
      btn.innerText = 'Deleting...';

      google.script.run
        .withSuccessHandler(function(res) {
          btn.disabled = false;
          btn.innerText = 'Delete';
          if(res.success) {
            closeDeleteModal();
            refreshData();
            showToast('Teacher deleted successfully!', 'success');
          } else {
            showToast(res && res.message ? res.message : 'Error deleting teacher.', 'error');
          }
        })
        .withFailureHandler(function(err) {
          btn.disabled = false;
          btn.innerText = 'Delete';
          showToast('Error: ' + (err ? err.message : 'Could not delete teacher.'), 'error');
        })
        .deleteTeacher(currentDeleteTeacher);
    };
  </script>
</body>
</html>
