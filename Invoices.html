<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: #f4f7fc; padding: 40px; height: 100vh; overflow-x: hidden; }

    /* --- HEADER --- */
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .page-title { font-size: 22px; color: #0f172a; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .page-title span { color: #64748b; font-weight: 400; font-size: 16px; background: #e2e8f0; padding: 2px 10px; border-radius: 20px; }
    .action-btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .action-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); }

    /* --- TOOLBAR --- */
    .toolbar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 10px 10px 0 0; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; gap: 12px; margin: 0 -40px; padding-left: 60px; padding-right: 60px; }
    .toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .search-box { display: flex; align-items: center; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 8px; width: 280px; background: #f8fafc; }
    .search-box input { border: none; outline: none; background: transparent; width: 100%; margin-left: 8px; font-size: 14px; color: #333; }
    .form-select { padding: 8px 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; color: #0f172a; background: #fff; outline: none; transition: border-color 0.2s; cursor: pointer; }
    .form-select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }

    /* --- TABLE --- */
    .table-container { background: white; border-radius: 0 0 10px 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow-x: auto; margin: 0 -40px; padding: 0 40px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { background: #f8fafc; border-bottom: 2px solid #e2e8f0; }
    th { text-align: left; padding: 16px 20px; color: #475569; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; white-space: nowrap; }
    td { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
    tr:hover { background-color: #f8fafc; }

    /* --- BADGES --- */
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
    .status-paid { background: #dcfce7; color: #166534; }
    .status-unpaid { background: #fee2e2; color: #991b1b; }
    .status-partial { background: #fef9c3; color: #854d0e; }
    .status-overdue { background: #f97316; color: white; }

    /* --- ACTIONS --- */
    .actions-cell { display: flex; gap: 10px; justify-content: center; }
    .action-icon-btn { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 6px; color: #64748b; display: inline-flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .action-icon-btn:hover { transform: scale(1.1); }
    .action-icon-btn.edit-btn:hover { background: #eff6ff; color: #2563eb; }
    .action-icon-btn.delete-btn:hover { background: #fef2f2; color: #dc2626; }

    /* --- LOADING --- */
    #loading { text-align: center; padding: 40px; color: #64748b; }

    /* --- MODALS --- */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: white; width: 90%; max-width: 600px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); transform: scale(0.95); transition: transform 0.25s ease; overflow: hidden; display: flex; flex-direction: column; }
    .modal-backdrop.active .modal-content { transform: scale(1); }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 18px; color: #0f172a; font-weight: 600; }
    .modal-close { color: #94a3b8; font-size: 24px; background: none; border: none; cursor: pointer; }
    .modal-close:hover { color: #334155; }
    .modal-body { padding: 24px; max-height: 70vh; overflow-y: auto; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid #f1f5f9; background: #f8fafc; display: flex; justify-content: flex-end; gap: 12px; }
    
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #475569; margin-bottom: 6px; }
    .form-input, .form-select { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; color: #0f172a; background: #fff; transition: border-color 0.15s; }
    .form-input:focus, .form-select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    
    /* Searchable Student Dropdown Styling */
    .searchable-select-container {
      position: relative;
      width: 100%;
    }
    .searchable-select-list {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 100%;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 1050;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      display: none;
    }
    .searchable-select-item {
      padding: 10px 14px;
      font-size: 14px;
      color: #0f172a;
      cursor: pointer;
      transition: background-color 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f1f5f9;
    }
    .searchable-select-item:last-child {
      border-bottom: none;
    }
    .searchable-select-item:hover, .searchable-select-item.highlighted {
      background-color: #f1f5f9;
    }
    .searchable-select-item .student-meta {
      font-size: 12px;
      color: #64748b;
      background: #f1f5f9;
      padding: 2px 8px;
      border-radius: 12px;
      white-space: nowrap;
      margin-left: 8px;
    }
    .searchable-select-no-results {
      padding: 12px 14px;
      font-size: 14px;
      color: #64748b;
      text-align: center;
    }
    
    .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; color: #1e293b; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }

    @media (max-width: 768px) {
      body { padding: 20px; }
      .table-container { margin: 0 -20px; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .toolbar { flex-direction: column; align-items: flex-start; }
      .toolbar-left, .toolbar-right { width: 100%; flex-direction: column; }
      .search-box { width: 100%; }
      .toolbar-right select { width: 100%; }
      .form-grid-3, .form-grid-2 { grid-template-columns: 1fr; }
    }

    /* --- DARK MODE STYLES --- */
    body.dark-mode { background-color: #0f172a; color: #f1f5f9; }
    body.dark-mode .page-title { color: #f1f5f9; }
    body.dark-mode .page-title span { background: #1e293b; color: #94a3b8; }
    body.dark-mode .toolbar { background: #1e293b; border-bottom-color: #334155; }
    body.dark-mode .search-box { background: #0f172a; border-color: #334155; }
    body.dark-mode .search-box input { color: #f1f5f9; }
    body.dark-mode .form-input, body.dark-mode .form-select { background: #1e293b; border-color: #334155; color: #f1f5f9; }
    body.dark-mode .searchable-select-list { background: #1e293b; border-color: #334155; }
    body.dark-mode .searchable-select-item { color: #f1f5f9; border-bottom-color: #334155; }
    body.dark-mode .searchable-select-item:hover, body.dark-mode .searchable-select-item.highlighted { background-color: #334155; }
    body.dark-mode .searchable-select-item .student-meta { background: #0f172a; color: #94a3b8; }
    body.dark-mode .searchable-select-no-results { color: #94a3b8; }
    body.dark-mode .table-container { background: #1e293b; }
    body.dark-mode thead { background: #0f172a; border-bottom-color: #334155; }
    body.dark-mode th { color: #94a3b8; }
    body.dark-mode td { color: #f1f5f9; border-bottom-color: #334155; }
    body.dark-mode tr:hover { background-color: #334155; }
    body.dark-mode .modal-content { background: #1e293b; }
    
    /* Student name styling in dark mode */
    body.dark-mode td span[style*="color:#64748b"] {
      color: #94a3b8 !important;
    }
    body.dark-mode .modal-header { border-bottom-color: #334155; }
    body.dark-mode .modal-header h3 { color: #f1f5f9; }
    body.dark-mode .modal-footer { background: #0f172a; border-top-color: #334155; }
    body.dark-mode .form-label { color: #94a3b8; }
    body.dark-mode .btn-secondary { background: #334155; color: #f1f5f9; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="page-header">
    <div class="page-title">
      🧾 Invoices
      <span id="invCount">0</span>
    </div>
    <button class="action-btn" onclick="openAddModal()">+ Create Invoice</button>
  </div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Search ID, Student, or Status..." onkeyup="filterTable()">
      </div>
    </div>
    <div class="toolbar-right">
      <select id="academicYearFilter" class="form-select" onchange="filterTable()">
        <option value="">All Academic Years</option>
      </select>
      <select id="statusFilter" class="form-select" onchange="filterTable()">
        <option value="">All Statuses</option>
        <option value="Paid">Paid</option>
        <option value="Unpaid">Unpaid</option>
        <option value="Partial">Partial</option>
        <option value="Overdue">Overdue</option>
      </select>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-container">
    <div id="loading">Loading invoice data...</div>
    <table id="invTable" style="display:none;">
      <thead>
        <tr>
          <th>Invoice ID</th>
          <th>Student</th>
          <th>Issue Date</th>
          <th>Due Date</th>
          <th>Category</th>
          <th>Amount Due</th>
          <th>Status</th>
          <th>Acad. Year</th>
          <th>Term</th>
          <th class="text-center" style="text-align: center;">Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <!-- ADD/EDIT MODAL -->
  <div class="modal-backdrop" id="invModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Create New Invoice</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="invForm" onsubmit="handleSubmit(event)">
        <input type="hidden" id="formInvoiceId">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="studentSearchInput">Student <span style="color: #ef4444;">*</span></label>
            <div class="searchable-select-container">
              <input 
                type="text" 
                id="studentSearchInput" 
                class="form-input" 
                placeholder="Type student name or ID to search..." 
                autocomplete="off"
                required
                onfocus="openStudentDropdown()"
                oninput="filterStudentDropdown(this.value)"
                onkeydown="handleStudentKeydown(event)"
              >
              <input type="hidden" id="studentId" required>
              <div id="studentSearchDropdown" class="searchable-select-list"></div>
            </div>
          </div>
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="issueDate">Issue Date</label>
              <input type="date" id="issueDate" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="dueDate">Due Date</label>
              <input type="date" id="dueDate" class="form-input" required>
            </div>
          </div>
          <div class="form-grid-3">
            <div class="form-group">
              <label class="form-label" for="category">Category</label>
              <select id="category" class="form-select" required>
                <option value="" disabled selected>Select Category</option>
                <option value="Tuition">Tuition</option>
                <option value="Lab Fee">Lab Fee</option>
                <option value="Sports">Sports</option>
                <option value="Fine">Fine</option>
                <option value="Transportation">Transportation</option>
                <option value="Books">Books</option>
                <option value="Uniform">Uniform</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="amountDue">Amount Due (GHS)</label>
              <input type="number" id="amountDue" class="form-input" placeholder="0.00" min="0" step="0.01" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="status">Status</label>
              <select id="status" class="form-select" required>
                <option value="Unpaid">Unpaid</option>
                <option value="Paid">Paid</option>
                <option value="Partial">Partial</option>
                <option value="Overdue">Overdue</option>
              </select>
            </div>
          </div>
          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="academicYear">Academic Year</label>
              <select id="academicYear" class="form-select" required>
                <option value="" disabled selected>Select Year</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="term">Term</label>
              <select id="term" class="form-select" required>
                <option value="" disabled selected>Select Term</option>
                <option value="Term 1">Term 1</option>
                <option value="Term 2">Term 2</option>
                <option value="Term 3">Term 3</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Invoice</button>
        </div>
      </form>
    </div>
  </div>

  <!-- DELETE CONFIRM MODAL -->
  <div class="modal-backdrop" id="deleteModal">
    <div class="modal-content" style="max-width: 400px;">
      <div class="modal-header">
        <h3>Delete Invoice</h3>
        <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="color: #64748b; font-size: 15px; line-height: 1.5;">
          Are you sure you want to delete invoice <strong id="deleteInvId" style="color: #0f172a;"></strong>? This action cannot be undone.
        </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <script>
    let invList = [];
    let studentsList = [];
    let academicYearsList = [];
    let currentDeleteId = null;
    let activeAcademicYear = '';
    let highlightedStudentIndex = -1;
    let filteredStudents = [];

    /* --- SEARCHABLE STUDENT DROPDOWN LOGIC --- */
    function openStudentDropdown() {
      const query = document.getElementById('studentSearchInput').value.trim();
      renderStudentDropdown(query);
    }

    function filterStudentDropdown(query) {
      const selectedId = document.getElementById('studentId').value;
      const currentSelected = studentsList.find(s => s.studentId === selectedId);
      const currentDisplayText = currentSelected ? `${currentSelected.studentId} - ${currentSelected.fullName}` : '';
      if (currentDisplayText && query.trim() !== currentDisplayText) {
        document.getElementById('studentId').value = '';
      }
      renderStudentDropdown(query);
    }

    function renderStudentDropdown(query) {
      const dropdown = document.getElementById('studentSearchDropdown');
      if (!dropdown) return;
      dropdown.innerHTML = '';
      highlightedStudentIndex = -1;

      const q = (query || '').toLowerCase().trim();
      filteredStudents = studentsList.filter(s => {
        if (!q) return true;
        const id = String(s.studentId || '').toLowerCase();
        const name = String(s.fullName || '').toLowerCase();
        const cls = String(s.studentClass || '').toLowerCase();
        const combined = `${id} - ${name}`.toLowerCase();
        return id.includes(q) || name.includes(q) || cls.includes(q) || combined.includes(q);
      });

      if (filteredStudents.length === 0) {
        dropdown.innerHTML = '<div class="searchable-select-no-results">No students found</div>';
        dropdown.style.display = 'block';
        return;
      }

      const limit = Math.min(filteredStudents.length, 50);
      for (let i = 0; i < limit; i++) {
        const s = filteredStudents[i];
        const item = document.createElement('div');
        item.className = 'searchable-select-item';
        item.setAttribute('data-index', i);
        item.innerHTML = `
          <div>
            <strong>${escapeHtml(s.studentId)}</strong> — ${escapeHtml(s.fullName)}
          </div>
          ${s.studentClass ? `<span class="student-meta">${escapeHtml(s.studentClass)}</span>` : ''}
        `;
        item.onmousedown = function(e) {
          e.preventDefault();
          selectStudent(s);
        };
        dropdown.appendChild(item);
      }

      if (filteredStudents.length > 50) {
        const more = document.createElement('div');
        more.className = 'searchable-select-no-results';
        more.style.fontSize = '12px';
        more.innerText = `Showing 50 of ${filteredStudents.length} students. Type more to narrow search.`;
        dropdown.appendChild(more);
      }

      dropdown.style.display = 'block';
    }

    function selectStudent(student) {
      if (!student) return;
      document.getElementById('studentId').value = student.studentId;
      document.getElementById('studentSearchInput').value = `${student.studentId} - ${student.fullName}`;
      const dropdown = document.getElementById('studentSearchDropdown');
      if (dropdown) dropdown.style.display = 'none';
      highlightedStudentIndex = -1;
    }

    function handleStudentKeydown(e) {
      const dropdown = document.getElementById('studentSearchDropdown');
      if (!dropdown || dropdown.style.display === 'none') {
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          openStudentDropdown();
          e.preventDefault();
        }
        return;
      }

      const items = dropdown.querySelectorAll('.searchable-select-item');
      if (!items.length) return;

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        highlightedStudentIndex = Math.min(highlightedStudentIndex + 1, items.length - 1);
        updateHighlight(items);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        highlightedStudentIndex = Math.max(highlightedStudentIndex - 1, 0);
        updateHighlight(items);
      } else if (e.key === 'Enter') {
        if (highlightedStudentIndex >= 0 && highlightedStudentIndex < filteredStudents.length) {
          e.preventDefault();
          selectStudent(filteredStudents[highlightedStudentIndex]);
        }
      } else if (e.key === 'Escape') {
        dropdown.style.display = 'none';
        highlightedStudentIndex = -1;
      }
    }

    function updateHighlight(items) {
      items.forEach((item, idx) => {
        if (idx === highlightedStudentIndex) {
          item.classList.add('highlighted');
          item.scrollIntoView({ block: 'nearest' });
        } else {
          item.classList.remove('highlighted');
        }
      });
    }

    // Close student searchable dropdown when clicking outside
    document.addEventListener('click', function(e) {
      const container = document.querySelector('.searchable-select-container');
      const dropdown = document.getElementById('studentSearchDropdown');
      if (container && dropdown && !container.contains(e.target)) {
        dropdown.style.display = 'none';
      }
    });

    /* --- SANITIZATION & HELPERS --- */
    function decodeSanitized(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&quot;/g, '"')
        .replace(/&#039;/g, "'")
        .replace(/&#x2F;/gi, '/')
        .replace(/&amp;/g, '&'); // last, to avoid double-decoding
    }

    function escapeHtml(value) {
      if (value === null || value === undefined) return '';
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function isActiveAcademicYear(year) {
      return String(year && year.status || '').trim().toLowerCase() === 'active';
    }

    function selectActiveAcademicYear() {
      const select = document.getElementById('academicYear');
      if (!select || !activeAcademicYear) return false;
      select.value = activeAcademicYear;
      return select.value === activeAcademicYear;
    }

    /* --- ACADEMIC YEARS POPULATION --- */
    function populateAcademicYearOptions(years) {
      const formSelect = document.getElementById('academicYear');
      const filterSelect = document.getElementById('academicYearFilter');
      
      academicYearsList = years || [];
      const activeYears = academicYearsList.filter(isActiveAcademicYear);
      activeAcademicYear = activeYears.length ? String(activeYears[0].academicYear || '').trim() : '';
      
      // Populate form dropdown (only active years by default)
      if (formSelect) {
        formSelect.innerHTML = '<option value="" disabled selected>Select Year</option>';
        activeYears.forEach(y => {
          const opt = document.createElement('option');
          opt.value = y.academicYear;
          opt.textContent = `${y.academicYear} (Active)`;
          if (y.academicYear === activeAcademicYear) {
            opt.selected = true;
          }
          formSelect.appendChild(opt);
        });

        if (activeAcademicYear) {
          selectActiveAcademicYear();
        } else {
          const option = document.createElement('option');
          option.value = '';
          option.disabled = true;
          option.textContent = 'No active academic year configured';
          formSelect.appendChild(option);
          formSelect.selectedIndex = formSelect.options.length - 1;
        }
      }
      
      // Populate filter dropdown (all years) and select active year
      if (filterSelect) {
        const currentFilterVal = filterSelect.value;
        filterSelect.innerHTML = '<option value="">All Academic Years</option>';
        
        // Add active year first
        if (activeAcademicYear) {
          const activeOpt = document.createElement('option');
          activeOpt.value = activeAcademicYear;
          activeOpt.textContent = `${activeAcademicYear} (Active)`;
          filterSelect.appendChild(activeOpt);
        }
        
        // Add other years
        academicYearsList.forEach(y => {
          if (y.academicYear !== activeAcademicYear) {
            const opt = document.createElement('option');
            opt.value = y.academicYear;
            opt.textContent = y.academicYear;
            filterSelect.appendChild(opt);
          }
        });

        // Set filter to active year by default, or keep user's existing selection
        if (currentFilterVal && Array.from(filterSelect.options).some(o => o.value === currentFilterVal)) {
          filterSelect.value = currentFilterVal;
        } else if (activeAcademicYear) {
          filterSelect.value = activeAcademicYear;
        }
      }
    }

    // Keep a historical invoice editable without offering inactive years when a new invoice is created
    function ensureAcademicYearOption(year) {
      const select = document.getElementById('academicYear');
      if (!select || !year) return;
      const exists = Array.from(select.options).some(option => option.value === year);
      if (!exists) {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = `${year} (Inactive / historical)`;
        select.appendChild(option);
      }
    }

    function ensureCategoryOption(category) {
      const select = document.getElementById('category');
      if (!select || !category) return;
      const exists = Array.from(select.options).some(option => option.value === category);
      if (!exists) {
        const option = document.createElement('option');
        option.value = category;
        option.textContent = category;
        select.appendChild(option);
      }
    }

    /* --- INITIALIZATION --- */
    document.addEventListener('DOMContentLoaded', function() {
      // Set default dates
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('issueDate').value = today;
      
      loadDropdowns();
      refreshData();
    });

    function loadDropdowns() {
      // Load Students
      google.script.run.withSuccessHandler(function(students) {
        studentsList = students || [];
      }).getStudentIdNamePairs();

      // Load Academic Years
      google.script.run.withSuccessHandler(function(years) {
        populateAcademicYearOptions(years);
      }).getAcademicYearsData();
    }

    function refreshData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('invTable').style.display = 'none';
      google.script.run
        .withSuccessHandler(function(years) {
          if (years && years.length) {
            populateAcademicYearOptions(years);
          }
          google.script.run
            .withSuccessHandler(renderTable)
            .withFailureHandler(function(err) {
              document.getElementById('loading').style.display = 'none';
              document.getElementById('invTable').style.display = 'table';
              document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" style="text-align:center; padding:30px; color:#ef4444;">Error loading invoices: ' + (err && err.message ? err.message : 'Unknown error') + '</td></tr>';
            })
            .getInvoicesData();
        })
        .withFailureHandler(function() {
          google.script.run
            .withSuccessHandler(renderTable)
            .withFailureHandler(function(err) {
              document.getElementById('loading').style.display = 'none';
              document.getElementById('invTable').style.display = 'table';
              document.getElementById('tableBody').innerHTML = '<tr><td colspan="10" style="text-align:center; padding:30px; color:#ef4444;">Error loading invoices: ' + (err && err.message ? err.message : 'Unknown error') + '</td></tr>';
            })
            .getInvoicesData();
        })
        .getAcademicYearsData();
    }

    /* --- TABLE RENDERING & FILTERING --- */
    function renderTable(data) {
      invList = (data || []).map(row => ({
        invoiceId: decodeSanitized(row.invoiceId),
        studentId: decodeSanitized(row.studentId),
        studentName: decodeSanitized(row.studentName),
        studentClass: decodeSanitized(row.studentClass),
        academicYear: decodeSanitized(row.academicYear),
        term: decodeSanitized(row.term),
        category: decodeSanitized(row.category),
        items: decodeSanitized(row.items),
        amountDue: Number(row.amountDue) || 0,
        issueDate: decodeSanitized(row.issueDate),
        dueDate: decodeSanitized(row.dueDate),
        status: decodeSanitized(row.status),
        paymentStatus: decodeSanitized(row.paymentStatus)
      }));
      const tbody = document.getElementById('tableBody');
      const loading = document.getElementById('loading');
      const table = document.getElementById('invTable');
      const countBadge = document.getElementById('invCount');

      loading.style.display = 'none';
      table.style.display = 'table';
      countBadge.innerText = invList.length;

      tbody.innerHTML = '';
      if(invList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="10" style="text-align:center; padding:30px; color:#64748b;">No invoices found.</td></tr>`;
        return;
      }

      invList.forEach(row => {
        const tr = document.createElement('tr');
        tr.setAttribute('data-status', row.status || '');
        tr.setAttribute('data-academic-year', row.academicYear || '');
        tr.setAttribute('data-invoice-id', row.invoiceId);

        let statusClass = 'status-unpaid';
        if(row.status === 'Paid') statusClass = 'status-paid';
        else if(row.status === 'Partial') statusClass = 'status-partial';
        else if(row.status === 'Overdue') statusClass = 'status-overdue';

        const studentDisplay = row.studentName 
          ? `<div><strong>${escapeHtml(row.studentId)}</strong><br><span style="font-size:11px;color:#64748b;line-height:1.2;">${escapeHtml(row.studentName)}</span></div>`
          : `<strong>${escapeHtml(row.studentId)}</strong>`;

        tr.innerHTML = `
          <td><strong>${escapeHtml(row.invoiceId)}</strong></td>
          <td>${studentDisplay}</td>
          <td>${escapeHtml(row.issueDate)}</td>
          <td>${escapeHtml(row.dueDate)}</td>
          <td>${escapeHtml(row.category)}</td>
          <td>GHS ${(row.amountDue || 0).toFixed(2)}</td>
          <td><span class="status-badge ${statusClass}">${escapeHtml(row.status)}</span></td>
          <td>${escapeHtml(row.academicYear)}</td>
          <td>${escapeHtml(row.term)}</td>
          <td style="text-align: center;">
            <div class="actions-cell">
              <button class="action-icon-btn edit-btn" onclick="openEditModal('${escapeHtml(row.invoiceId)}')" title="Edit Invoice">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              </button>
              <button class="action-icon-btn delete-btn" onclick="openDeleteModal('${escapeHtml(row.invoiceId)}')" title="Delete Invoice">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
      filterTable();
      // Handle pending open request from parent shell (if any)
      try { if (window._pendingOpen && window._pendingOpen.type === 'invoice') { openInvoiceRecord(window._pendingOpen.invoiceId); window._pendingOpen = null; } } catch (e) { console.warn('openInvoiceRecord failed', e); }
    }

    function filterTable() {
      const searchVal = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const statusVal = (document.getElementById('statusFilter').value || '').trim().toLowerCase();
      const yearVal = (document.getElementById('academicYearFilter').value || '').trim().toLowerCase();
      const rows = document.querySelectorAll('#tableBody tr');
      const countBadge = document.getElementById('invCount');
      let visibleCount = 0;

      rows.forEach(row => {
        if (row.cells.length === 1 && row.cells[0].getAttribute('colspan')) return;
        const text = row.innerText.toLowerCase();
        const rowStatus = (row.getAttribute('data-status') || '').toLowerCase().trim();
        const rowYear = (row.getAttribute('data-academic-year') || (row.cells[7] ? row.cells[7].innerText : '')).toLowerCase().trim();
        
        const matchSearch = !searchVal || text.includes(searchVal);
        const matchStatus = !statusVal || rowStatus === statusVal;
        const matchYear = !yearVal || rowYear === yearVal;

        if (matchSearch && matchStatus && matchYear) {
          row.style.display = ''; visibleCount++;
        } else {
          row.style.display = 'none';
        }
      });
      if (countBadge) countBadge.innerText = visibleCount;
    }

    /* --- MODAL LOGIC --- */
    function openAddModal() { 
      document.getElementById('invForm').reset();
      document.getElementById('formInvoiceId').value = '';
      document.getElementById('studentSearchInput').value = '';
      document.getElementById('studentId').value = '';
      const dropdown = document.getElementById('studentSearchDropdown');
      if (dropdown) dropdown.style.display = 'none';

      document.getElementById('modalTitle').innerText = 'Create New Invoice';
      document.getElementById('saveBtn').innerText = 'Save Invoice';
      
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('issueDate').value = today;
      
      // Default due date to 14 days from today
      const dueDate = new Date();
      dueDate.setDate(dueDate.getDate() + 14);
      document.getElementById('dueDate').value = dueDate.toISOString().split('T')[0];

      // Dropdown data may have loaded before or after the button was clicked.
      // Apply the active year again so a new form never retains an old value.
      selectActiveAcademicYear();
      document.getElementById('invModal').classList.add('active'); 
    }

    function openEditModal(invoiceId) {
      const invoice = invList.find(i => i.invoiceId === invoiceId);
      if (!invoice) return alert('Error: Invoice not found.');

      document.getElementById('formInvoiceId').value = invoice.invoiceId;
      
      // Set student search field
      const student = studentsList.find(s => s.studentId === invoice.studentId);
      if (student) {
        document.getElementById('studentSearchInput').value = `${student.studentId} - ${student.fullName}`;
        document.getElementById('studentId').value = student.studentId;
      } else {
        const display = invoice.studentName ? `${invoice.studentId} - ${invoice.studentName}` : invoice.studentId;
        document.getElementById('studentSearchInput').value = display;
        document.getElementById('studentId').value = invoice.studentId;
      }
      
      const dropdown = document.getElementById('studentSearchDropdown');
      if (dropdown) dropdown.style.display = 'none';

      document.getElementById('issueDate').value = invoice.issueDate;
      document.getElementById('dueDate').value = invoice.dueDate;
      ensureCategoryOption(invoice.category);
      document.getElementById('category').value = invoice.category;
      document.getElementById('amountDue').value = invoice.amountDue;
      document.getElementById('status').value = invoice.status;
      ensureAcademicYearOption(invoice.academicYear);
      document.getElementById('academicYear').value = invoice.academicYear;
      document.getElementById('term').value = invoice.term;

      document.getElementById('modalTitle').innerText = 'Edit Invoice';
      document.getElementById('saveBtn').innerText = 'Update Invoice';
      document.getElementById('invModal').classList.add('active');
    }

    // Called by parent shell to open/focus a specific invoice
    window.openInvoiceRecord = function(invoiceId) {
      if (!invoiceId) return;
      const invoice = invList.find(i => i.invoiceId === invoiceId);
      if (invoice) {
        openEditModal(invoice.invoiceId);
        // highlight row
        const tr = document.querySelector(`tr[data-invoice-id="${invoiceId}"]`);
        if (tr) { tr.scrollIntoView({ behavior: 'smooth', block: 'center' }); tr.style.boxShadow = 'inset 0 0 0 3px rgba(59,130,246,0.08)'; setTimeout(() => tr.style.boxShadow = '', 3000); }
        return;
      }
      // If not present, try refreshing data and set a pending request
      window._pendingOpen = { type: 'invoice', invoiceId: invoiceId };
      refreshData();
    };

    function closeModal() { 
      document.getElementById('invModal').classList.remove('active'); 
      const dropdown = document.getElementById('studentSearchDropdown');
      if (dropdown) dropdown.style.display = 'none';
    }

    function handleSubmit(e) {
      e.preventDefault();
      
      let studentId = document.getElementById('studentId').value;
      if (!studentId) {
        // Try auto-resolving from input value
        const query = document.getElementById('studentSearchInput').value.trim().toLowerCase();
        const match = studentsList.find(s => 
          s.studentId.toLowerCase() === query || 
          `${s.studentId} - ${s.fullName}`.toLowerCase() === query ||
          s.fullName.toLowerCase() === query
        );
        if (match) {
          selectStudent(match);
          studentId = match.studentId;
        } else {
          alert('Please search and select a valid student from the list.');
          document.getElementById('studentSearchInput').focus();
          openStudentDropdown();
          return;
        }
      }

      const selectedStudent = studentsList.find(student => student.studentId === studentId) || {};
      const btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.innerText = 'Saving...';
      
      const invoiceId = document.getElementById('formInvoiceId').value;
      const data = {
        studentId: studentId,
        // Save the selected student's current name and class with the invoice.
        // This prevents newly-created invoices from having blank student details.
        studentName: selectedStudent.fullName || '',
        studentClass: selectedStudent.studentClass || '',
        issueDate: document.getElementById('issueDate').value,
        dueDate: document.getElementById('dueDate').value,
        category: document.getElementById('category').value,
        amountDue: parseFloat(document.getElementById('amountDue').value) || 0,
        status: document.getElementById('status').value,
        academicYear: document.getElementById('academicYear').value,
        term: document.getElementById('term').value
      };

      function submitInvoice(payload) {
        const isUpdate = !!invoiceId;
        const runner = google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.requiresAdminOverride && !payload.__adminAcademicYearOverride) {
              const proceed = confirm((res.message || 'This action needs admin confirmation.') + '\n\nClick OK to continue as Admin, or Cancel to stop.');
              if (!proceed) {
                btn.disabled = false; btn.innerText = isUpdate ? 'Update Invoice' : 'Save Invoice';
                alert('Invoice action cancelled.');
                return;
              }
              payload.__adminAcademicYearOverride = true;
              submitInvoice(payload);
              return;
            }
            btn.disabled = false; btn.innerText = isUpdate ? 'Update Invoice' : 'Save Invoice';
            if(res && res.success) {
              closeModal();
              refreshData();
              if (!isUpdate) alert(`Invoice created! ID: ${res.invoiceId}`);
            } else {
              alert('Error: ' + (res && res.message ? res.message : 'Failed to save invoice'));
            }
          })
          .withFailureHandler(function(err) {
            btn.disabled = false; btn.innerText = isUpdate ? 'Update Invoice' : 'Save Invoice';
            alert('Error: ' + (err && err.message ? err.message : 'Unknown error'));
          });

        if (isUpdate) {
          runner.updateInvoice(invoiceId, payload);
        } else {
          runner.addInvoice(payload);
        }
      }

      submitInvoice(data);
    }

    /* --- DELETE LOGIC --- */
    function openDeleteModal(invoiceId) {
      currentDeleteId = invoiceId;
      document.getElementById('deleteInvId').innerText = invoiceId;
      document.getElementById('deleteModal').classList.add('active');
    }
    function closeDeleteModal() { document.getElementById('deleteModal').classList.remove('active'); currentDeleteId = null; }

    document.getElementById('confirmDeleteBtn').onclick = function() {
      if (!currentDeleteId) return;
      const btn = this; btn.disabled = true; btn.innerText = 'Deleting...';

      function submitDelete(options) {
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.requiresAdminOverride && !(options && options.adminAcademicYearOverride)) {
              const proceed = confirm((res.message || 'This action needs admin confirmation.') + '\n\nClick OK to continue as Admin, or Cancel to stop.');
              if (!proceed) {
                btn.disabled = false; btn.innerText = 'Delete';
                alert('Invoice delete cancelled.');
                return;
              }
              submitDelete({ adminAcademicYearOverride: true });
              return;
            }
            btn.disabled = false; btn.innerText = 'Delete';
            if(res && res.success) { closeDeleteModal(); refreshData(); }
            else { alert('Error: ' + (res && res.message ? res.message : 'Failed to delete invoice')); }
          })
          .withFailureHandler(function(err) { btn.disabled = false; btn.innerText = 'Delete'; alert('Error: ' + (err && err.message ? err.message : 'Unknown error')); })
          .deleteInvoice(currentDeleteId, options || null);
      }

      submitDelete(null);
    };
  </script>
</body>
</html>
