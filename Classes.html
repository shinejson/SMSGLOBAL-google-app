<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: #f4f7fc; padding: 40px; height: 100vh; overflow-x: hidden; }

    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; }
    .page-title { font-size: 22px; color: #0f172a; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .page-title span { color: #64748b; font-weight: 400; font-size: 16px; background: #e2e8f0; padding: 2px 10px; border-radius: 20px; }
    .action-btn { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
    .action-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3); }

    .toolbar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 10px 10px 0 0; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; gap: 12px; margin: 0 -40px; }
    .search-box { display: flex; align-items: center; border: 1px solid #e2e8f0; padding: 8px 16px; border-radius: 8px; width: 300px; background: #f8fafc; }
    .search-box input { border: none; outline: none; background: transparent; width: 100%; margin-left: 8px; font-size: 14px; color: #333; }

    .list-container { background: white; border-radius: 0 0 10px 10px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); overflow: hidden; margin: 0 -40px; }
    .list-item { padding: 16px 20px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
    .list-item:last-child { border-bottom: none; }
    .list-item:hover { background-color: #f8fafc; }
    .list-item-content { display: flex; align-items: center; gap: 20px; flex: 1; }
    .list-item h4 { font-size: 15px; font-weight: 500; color: #0f172a; margin: 0; }
    .student-count { display: flex; align-items: center; justify-content: center; background: #dbeafe; color: #1e40af; font-weight: 600; font-size: 14px; width: 50px; height: 50px; border-radius: 8px; min-width: 50px; }
    .list-item-actions { display: flex; gap: 8px; }
    .btn-icon { background: #f1f5f9; color: #475569; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
    .btn-icon:hover { background: #e2e8f0; color: #1e293b; }
    .btn-icon.delete:hover { background: #fee2e2; color: #991b1b; }

    #loading { text-align: center; padding: 40px; color: #64748b; }

    /* MODAL */
    .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .modal-backdrop.active { opacity: 1; pointer-events: auto; }
    .modal-content { background: white; width: 90%; max-width: 450px; border-radius: 12px; transform: scale(0.95); transition: transform 0.25s ease; overflow: hidden; }
    .modal-backdrop.active .modal-content { transform: scale(1); }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 18px; color: #0f172a; font-weight: 600; }
    .modal-close { color: #94a3b8; font-size: 24px; background: none; border: none; cursor: pointer; }
    .modal-body { padding: 24px; }
    .modal-footer { padding: 16px 24px; border-top: 1px solid #f1f5f9; background: #f8fafc; display: flex; justify-content: flex-end; gap: 12px; }
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #475569; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    .form-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
    .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; color: #1e293b; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .btn-icon:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .btn-icon.delete:disabled:hover { background: #f1f5f9; color: #475569; }

    @media (max-width: 768px) {
      body { padding: 20px; }
      .list-container { margin: 0 -20px; }
      .page-header { flex-direction: column; align-items: flex-start; }
      .search-box { width: 100%; }
    }

    /* --- DARK MODE --- */
    body.dark-mode { background-color: #0f172a; color: #f1f5f9; }
    body.dark-mode .page-title { color: #f1f5f9; }
    body.dark-mode .page-title span { background: #334155; color: #94a3b8; }
    body.dark-mode .toolbar { background: #1e293b; border-bottom-color: #334155; }
    body.dark-mode .search-box { background: #0f172a; border-color: #334155; }
    body.dark-mode .search-box input { color: #f1f5f9; }
    body.dark-mode .search-box input::placeholder { color: #64748b; }
    body.dark-mode .list-container { background: #1e293b; }
    body.dark-mode .list-item { border-bottom-color: #334155; }
    body.dark-mode .list-item:hover { background-color: #334155; }
    body.dark-mode .list-item h4 { color: #f1f5f9; }
    body.dark-mode .student-count { background: #1e3a5f; color: #93c5fd; }
    body.dark-mode #loading { color: #94a3b8; }
    body.dark-mode .btn-icon { background: #334155; color: #94a3b8; }
    body.dark-mode .btn-icon:hover { background: #475569; color: #f1f5f9; }
    body.dark-mode .btn-icon.delete:hover { background: #7f1d1d; color: #fca5a5; }
    body.dark-mode .modal-content { background: #1e293b; }
    body.dark-mode .modal-header { border-bottom-color: #334155; }
    body.dark-mode .modal-header h3 { color: #f1f5f9; }
    body.dark-mode .modal-close { color: #94a3b8; }
    body.dark-mode .modal-close:hover { color: #f1f5f9; }
    body.dark-mode .modal-footer { background: #0f172a; border-top-color: #334155; }
    body.dark-mode .form-label { color: #94a3b8; }
    body.dark-mode .form-input { background: #0f172a; border-color: #334155; color: #f1f5f9; }
    body.dark-mode .form-input:focus { border-color: #3b82f6; }
    body.dark-mode .btn-secondary { background: #334155; color: #f1f5f9; }
    body.dark-mode .btn-secondary:hover { background: #475569; }
    body.dark-mode small { color: #94a3b8; }

    /* --- TOAST NOTIFICATIONS --- */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    
    .toast {
      background: #1e293b;
      color: #f1f5f9;
      padding: 16px 20px;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 300px;
      max-width: 450px;
      opacity: 0;
      transform: translateX(400px);
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      pointer-events: auto;
      border-left: 4px solid #3b82f6;
    }
    
    .toast.show {
      opacity: 1;
      transform: translateX(0);
    }
    
    .toast.success {
      border-left-color: #10b981;
    }
    
    .toast.error {
      border-left-color: #ef4444;
    }
    
    .toast.warning {
      border-left-color: #f59e0b;
    }
    
    .toast-icon {
      font-size: 24px;
      flex-shrink: 0;
    }
    
    .toast-content {
      flex: 1;
    }
    
    .toast-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 2px;
    }
    
    .toast-message {
      font-size: 13px;
      opacity: 0.9;
    }
    
    .toast-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
      padding: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: all 0.2s;
    }
    
    .toast-close:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #f1f5f9;
    }
    
    body.dark-mode .toast {
      background: #1e293b;
      color: #f1f5f9;
    }
    
    @media (max-width: 768px) {
      .toast-container {
        right: 10px;
        left: 10px;
        top: 10px;
      }
      
      .toast {
        min-width: auto;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <div class="page-header">
    <div class="page-title">
      📚 Class List
      <span id="classCount">0</span>
    </div>
    <button class="action-btn" onclick="openAddModal()">+ Add Class</button>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="searchInput" placeholder="Search classes..." onkeyup="filterList()">
    </div>
  </div>

  <div class="list-container">
    <div id="loading">Loading classes...</div>
    <div id="classesList"></div>
  </div>

  <!-- ADD CLASS MODAL -->
  <div class="modal-backdrop" id="classModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Add New Class</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <form id="classForm" onsubmit="handleSubmit(event)">
        <div class="modal-body">
          <input type="hidden" id="classId" value="">
          <div class="form-group">
            <label class="form-label" for="className">Class Name</label>
            <input type="text" id="className" class="form-input" placeholder="e.g. JHS 4" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="studentCount">Student Count</label>
            <input type="text" id="studentCount" class="form-input" readonly disabled placeholder="Auto-calculated">
            <small style="color: #64748b; margin-top: 4px; display: block;">This value is automatically calculated based on enrolled students.</small>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Class</button>
        </div>
      </form>
    </div>
  </div>

  <!-- CONFIRMATION MODAL -->
  <div class="modal-backdrop" id="confirmModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3><span class="modal-icon">⚠️</span><span id="confirmModalTitle">Confirm</span></h3>
        <button class="modal-close" onclick="closeConfirmModal()">&times;</button>
      </div>
      <div class="modal-body" id="confirmModalMessage"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeConfirmModal()">Cancel</button>
        <button type="button" class="btn btn-primary" id="confirmModalButton">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    let classList = [];

    // Toast notification function
    function showToast(message, type = 'success', title = '') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      const icons = {
        success: '✅',
        error: '❌',
        warning: '⚠️',
        info: 'ℹ️'
      };
      
      const titles = {
        success: title || 'Success',
        error: title || 'Error',
        warning: title || 'Warning',
        info: title || 'Info'
      };
      
      toast.innerHTML = `
        <div class="toast-icon">${icons[type] || icons.info}</div>
        <div class="toast-content">
          <div class="toast-title">${titles[type]}</div>
          <div class="toast-message">${message}</div>
        </div>
        <button class="toast-close" onclick="removeToast(this.parentElement)">×</button>
      `;
      
      container.appendChild(toast);
      
      // Trigger animation
      setTimeout(() => toast.classList.add('show'), 10);
      
      // Auto remove after 4 seconds
      setTimeout(() => removeToast(toast), 4000);
    }
    
    function removeToast(toast) {
      if (!toast) return;
      toast.classList.remove('show');
      setTimeout(() => {
        if (toast.parentElement) {
          toast.parentElement.removeChild(toast);
        }
      }, 300);
    }

    document.addEventListener('DOMContentLoaded', function() { refreshData(); });

    function refreshData() {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('classesList').style.display = 'none';
      google.script.run
        .withSuccessHandler(renderList)
        .withFailureHandler(function(err) {
          document.getElementById('loading').innerText = 'Error loading classes: ' + (err && err.message ? err.message : err);
        })
        .getClassesData();
    }

    function normalizeClassName(value) {
      return String(value || '').trim().replace(/\s+/g, ' ').toLowerCase();
    }

    function renderList(data) {
      classList = data || [];
      const container = document.getElementById('classesList');
      const loading = document.getElementById('loading');
      const countBadge = document.getElementById('classCount');

      loading.style.display = 'none';
      container.style.display = 'block';
      countBadge.innerText = classList.length;

      container.innerHTML = '';
      if(classList.length === 0) {
        container.innerHTML = `<div style="padding: 30px; text-align: center; color: #64748b;">No classes found.</div>`;
        return;
      }

      classList.forEach(classItem => {
        const div = document.createElement('div');
        const studentCount = Number(classItem.studentCount) || 0;
        const hasStudents = studentCount > 0;
        div.className = 'list-item';
        div.setAttribute('data-name', normalizeClassName(classItem.className));
        div.innerHTML = `
          <div class="list-item-content">
            <h4>${classItem.className}</h4>
            <div class="student-count" title="${studentCount} enrolled student${studentCount === 1 ? '' : 's'}">${studentCount}</div>
          </div>
          <div class="list-item-actions">
            <button type="button" class="btn-icon" onclick="editClass(${Number(classItem.id)})">✏️ Edit</button>
            <button type="button" class="btn-icon delete" onclick="deleteClassConfirm(${Number(classItem.id)})" ${hasStudents ? 'disabled title="Move or remove students before deleting this class"' : ''}>🗑️ Delete</button>
          </div>
        `;
        container.appendChild(div);
      });
      filterList();
    }

    function filterList() {
      const searchVal = normalizeClassName(document.getElementById('searchInput').value);
      const items = document.querySelectorAll('.list-item');
      const countBadge = document.getElementById('classCount');
      let visibleCount = 0;

      items.forEach(item => {
        if(item.getAttribute('data-name').includes(searchVal)) {
          item.style.display = 'flex'; visibleCount++;
        } else {
          item.style.display = 'none';
        }
      });
      countBadge.innerText = visibleCount;
    }

    function openAddModal() { 
      document.getElementById('classId').value = '';
      document.getElementById('classForm').reset();
      document.getElementById('modalTitle').innerText = 'Add New Class';
      document.getElementById('saveBtn').innerText = 'Save Class';
      document.getElementById('classModal').classList.add('active');
    }

    function closeModal() { 
      document.getElementById('classModal').classList.remove('active');
    }

    function openConfirmModal(options) {
      const modal = document.getElementById('confirmModal');
      if (!modal) return;
      document.getElementById('confirmModalTitle').textContent = options.title || 'Confirm';
      document.getElementById('confirmModalMessage').textContent = options.message || '';
      const button = document.getElementById('confirmModalButton');
      button.textContent = options.confirmText || 'Confirm';
      button.className = 'btn ' + (options.confirmClass || 'btn-primary');
      button.onclick = function() {
        closeConfirmModal();
        if (typeof options.onConfirm === 'function') options.onConfirm();
      };
      modal.classList.add('active');
    }

    function closeConfirmModal() {
      const modal = document.getElementById('confirmModal');
      if (!modal) return;
      modal.classList.remove('active');
      const button = document.getElementById('confirmModalButton');
      if (button) button.onclick = null;
    }

    function editClass(id) {
      const classItem = classList.find(c => Number(c.id) === Number(id));
      if(!classItem) { 
        showToast('Class not found in the list.', 'error');
        return; 
      }
      
      document.getElementById('classId').value = id;
      document.getElementById('className').value = classItem.className;
      document.getElementById('studentCount').value = classItem.studentCount;
      document.getElementById('modalTitle').innerText = 'Edit Class';
      document.getElementById('saveBtn').innerText = 'Update Class';
      document.getElementById('classModal').classList.add('active');
    }

    function deleteClassConfirm(id) {
      const classItem = classList.find(c => Number(c.id) === Number(id));
      if(!classItem) { 
        showToast('Class not found in the list.', 'error');
        return; 
      }

      const studentCount = Number(classItem.studentCount) || 0;
      if (studentCount > 0) {
        showToast('Cannot delete "' + classItem.className + '" because ' + studentCount + ' student' + (studentCount === 1 ? ' is' : 's are') + ' currently assigned to this class.', 'warning', 'Cannot Delete');
        return;
      }

      openConfirmModal({
        title: 'Delete Class',
        message: `Are you sure you want to delete the class "${classItem.className}"?`,
        confirmText: 'Delete',
        confirmClass: 'btn-danger',
        onConfirm: function() {
          deleteClass(id);
        }
      });
    }

    function deleteClass(id) {
      google.script.run
        .withSuccessHandler(function(res) {
          if(res.success) {
            alert('Class deleted successfully!');
            refreshData();
          } else {
            alert('Error: ' + (res.message || 'Could not delete class.'));
            refreshData();
          }
        })
        .withFailureHandler(function(err) {
          alert('Error: ' + err.message);
        })
        .deleteClass(id);
    }

    function handleSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');
      btn.disabled = true; btn.innerText = 'Saving...';
      
      const classId = document.getElementById('classId').value;
      const className = document.getElementById('className').value.trim();

      if (!className) {
        btn.disabled = false; btn.innerText = classId ? 'Update Class' : 'Save Class';
        alert('Please enter a class name.');
        return;
      }

      const duplicate = classList.find(c => normalizeClassName(c.className) === normalizeClassName(className) && Number(c.id) !== Number(classId || 0));
      if (duplicate) {
        btn.disabled = false; btn.innerText = classId ? 'Update Class' : 'Save Class';
        alert('A class named "' + duplicate.className + '" already exists.');
        return;
      }

      if (classId) {
        // Update existing class
        google.script.run
          .withSuccessHandler(function(res) {
            btn.disabled = false; btn.innerText = 'Update Class';
            if(res.success) {
              closeModal(); refreshData();
              alert('Class updated successfully!');
            } else {
              alert('Error: ' + (res.message || 'Could not update class.'));
            }
          })
          .withFailureHandler(function(err) {
            btn.disabled = false; btn.innerText = 'Update Class';
            alert('Error: ' + err.message);
          })
          .updateClass(parseInt(classId), className);
      } else {
        // Add new class
        google.script.run
          .withSuccessHandler(function(res) {
            btn.disabled = false; btn.innerText = 'Save Class';
            if(res.success) {
              closeModal(); refreshData();
              alert('Class added successfully!');
            } else {
              alert('Error: ' + (res.message || 'Could not add class.'));
            }
          })
          .withFailureHandler(function(err) {
            btn.disabled = false; btn.innerText = 'Save Class';
            alert('Error: ' + err.message);
          })
          .addClass(className);
      }
    }
  </script>
</body>
</html>
